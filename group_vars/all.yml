---
# =============================================================================
# uav_ansible — central configuration
# Every tunable lives here (per the locked scope). Pin versions; don't drift.
# Items marked TODO need a value confirmed on the actual hardware.
# =============================================================================

# --- Target platform (pinned) ------------------------------------------------
jetpack_release: "7.2"
l4t_release: "r39.2"                 # TODO confirm: cat /etc/nv_tegra_release  (e.g. r38.x)
ubuntu_codename: "noble"        # 24.04
ros_distro: "jazzy"

# --- Target user (the human account, not root) -------------------------------
target_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"

# =============================================================================
# base
# =============================================================================
system_hostname: "jethawk"
system_timezone: "Etc/UTC"
system_locale: "en_US.UTF-8"

base_packages:
  - build-essential
  - python3-pip
  - python3-venv
  - curl
  - wget
  - ca-certificates
  - gnupg
  - lsb-release
  - i2c-tools
  - usbutils
  - pps-tools
  - openssl                     # Priority: important on Ubuntu already; the
                                # station's enrollment bootstrap uses it

# Power / performance. nvpmodel modes of this image (JetPack 7.2, Orin NX 16 GB;
# /etc/nvpmodel.conf): 0 = MAXN, uncapped (8 cores to 1984 MHz, GPU 918 MHz, EMC
# 3199 MHz); 2 = 15W runs cores 0-3 only, capped at 1.42 GHz, GPU 612 MHz (1 = 10W:
# fewer cores still, 1.19 GHz); 3 = 25W keeps 8 cores at 1.5 GHz but caps the GPU
# at 408 MHz. The image's own default is 2. On 12S power the limit is thermal, so
# the mode is MAXN and the limit is set explicitly at the fan (jetson_fan_profile).
# nvfancontrol is closed-loop on the profile's rpm column: `max` holds the fan at
# its rated 6000 rpm (measured 2026-10-03: PWM 237, 6038 rpm), not at a raw 255.
nvpmodel_mode: 0
jetson_clocks_enabled: true     # pins every clock at the mode's maximum (no DVFS)
# nvfancontrol profile: quiet (JetPack's default: 187/255 from 74 C, full speed
# only from 95 C), cool (full speed from 70 C), or max (255/255 at every
# temperature; the base role defines it). Noise is irrelevant on the aircraft,
# cooling margin on a hot-day ground hold without prop wash is not. Airflow brings
# dust and ash through the fins: the heatsink is a post-flight inspection item.
jetson_fan_profile: max

# Swap (sized for colcon builds)
swap_enabled: true
swap_file: "/swapfile"
swap_size: "16G"

# Headless posture. false = boot to multi-user (no desktop), freeing RAM/GPU for
# ROS/perception — the right setting for the flight build. true keeps the GNOME
# desktop (handy during bench work with a monitor). Applies on the NEXT reboot.
gui_enabled: true               # TODO flip to false for the headless flight config
# Start the user's `systemd --user` services at boot without a login (for ROS
# app services run as the user). Harmless to leave on.
enable_user_linger: true

# =============================================================================
# dev_tools
# =============================================================================
dev_tools_packages:
  - git
  - git-lfs
  - nano
  - tmux
  - htop
  - tree
  - jq

# =============================================================================
# networking  (two L2 segments — NEVER bridged; see README)
# =============================================================================
netplan_renderer: "networkd"
netplan_file: "/etc/netplan/60-uav.yaml"              # drone LAN + PTP segment
netplan_uplink_file: "/etc/netplan/61-uav-uplink.yaml"  # wifi; applied first

# General drone LAN (Siyi-forced subnet) on the Holybro switch / Realtek r8168.
# The Jetson is the de-facto L3 gateway for this segment (it owns the wifi/NTRIP
# egress), so .1 is the conventional gateway address — fine here, not bad practice.
# PX4 is preconfigured at 192.168.144.2 and expects the XRCE agent at .1:8888.
# This interface carries NO default route (the Jetson IS the gateway); the
# default route comes from wifi below — keep lan_gateway empty.
lan_interface: "enP8p1s0"       # Holybro r8168 — confirmed via ip -br link
lan_address: "192.168.144.1/24"
lan_gateway: ""                 # leave empty — default route is via wifi

# PTP timing segment on the Intel i226 (M.2) — direct link to Robosense E1R
ptp_interface: "enP1p1s0"       # Intel i226 (igc) — confirmed via ip -br link
ptp_address: "192.168.145.1/30"

# Uplink: USB 802.11ac dongle (Cudy AC650 = Realtek RTL8811CU, rtl8821cu DKMS
# driver from kernel_modules), the Jetson's internet egress (NTRIP, apt,
# Tailscale). Credentials are secrets -> vault.yml.
# CAUTION: the home wifi subnet must NOT overlap 192.168.144.0/24 or .145.0/30.
# Since 2026-10-05 the dongle is a permanent fixture: the wifi_rfkill role
# soft-blocks the radio while the autopilot is armed (the UniRC link shares
# 2.4/5.8 GHz) and the egress falls back to the Siyi GCS (gcs_gateway role, its
# default route at gcs_gateway_route_metric); wifi's route has the lower metric,
# so the Jetson prefers it whenever both are up. Without the dongle the
# interface doesn't exist, the config is inert and a converge skips the
# bring-up. wifi_enabled: false is for a Jetson that should never join (it
# removes the uplink file, credentials and all).
wifi_enabled: true
wifi_route_metric: 50                  # below gcs_gateway_route_metric (100)
wifi_interface: "wlxd40dab451572"  # Cudy AC650 (d4:0d:ab:45:15:72) — confirmed via ip -br link
# Address: DHCP with a fixed lease on the UniFi gateway (d4:0d:ab:45:15:72 ->
# 192.168.1.42, moved from the old BrosTrend stick 74:19:f8:15:e6:a9 on
# 2026-10-05), so the name `jethawk` stays in the gateway DNS and the address
# never moves; a netplan static here would race the DHCP pool instead.
wifi_ssid: "{{ vault_wifi_ssid | default('TODO') }}"
wifi_password: "{{ vault_wifi_password | default('CHANGEME') }}"

# =============================================================================
# jtop
# =============================================================================
jetson_stats_version: "7.2.1"   # jtop service and the ROS client library must match

# =============================================================================
# kernel_modules  (AUDIT FIRST — only build what's genuinely missing)
# =============================================================================
# Kernel headers — needed for BOTH out-of-tree DKMS builds (wifi dongle) AND the
# dt-bindings headers the pps overlay #includes. Confirm the exact name on 7.2:
#   apt-cache search nvidia-l4t-kernel | grep -i header
kernel_headers_package: "nvidia-l4t-kernel-headers"
# Modules we expect ALREADY present in-kernel (verify, don't build). igc and
# ch341 turned out ABSENT on this kernel (audit confirmed) -> built via DKMS
# below. Nothing else to verify for now.
kernel_modules_verify: []
# Out-of-tree DKMS drivers, VENDORED as pinned tarballs under
# roles/kernel_modules/files/ (git-lfs). Each tarball has a top-level
# <name>-<version>/ dir with the source + a dkms.conf.
kernel_dkms_drivers:
  # Wi-Fi 802.11ax dongle — BrosTrend installer (linux.brostrend.com/install),
  # vendored for determinism. If a kernel bump breaks it, re-run that installer
  # on a bench unit and re-vendor /usr/src/rtl8852cu-<ver>.
  - name: "rtl8852cu"
    version: "1.19.22"
    module: "8852cu"                    # BUILT_MODULE_NAME (lsmod/modinfo name)
    tarball: "rtl8852cu-1.19.22.tar.gz"
  # Intel i226 NIC (PTP grandmaster) + CH34x USB serial — extracted from the L4T
  # r39.2 kernel source (kernel-noble), wrapped with a Kbuild + dkms.conf so they
  # build out-of-tree against the running kernel. Re-vendor from NVIDIA source on
  # a kernel bump (get_kernel_sources.sh builds the public_sources URL).
  - name: "igc"
    version: "6.8.12"
    module: "igc"
    tarball: "igc-6.8.12.tar.gz"
  - name: "ch341"
    version: "6.8.12"
    module: "ch341"
    tarball: "ch341-6.8.12.tar.gz"
  # Wi-Fi 802.11ac dongle (Cudy WU650 / AC650 = Realtek RTL8811CU, USB
  # 0bda:c811) -- the permanent uplink stick (2026-10-05). morrownr/8821cu-20210916
  # at bda65aac150d2cde0df9603206eec23a6f3b77c4 (2026-08-21), kernels 5.12-6.17,
  # firmware embedded (the tegra kernel cannot load .zst firmware). docs/ dropped
  # from the vendored copy; see UPSTREAM.txt inside the tarball.
  - name: "rtl8821cu"
    version: "5.12.0.4"
    module: "8821cu"
    tarball: "rtl8821cu-5.12.0.4.tar.gz"

# =============================================================================
# device_tree  (overlays applied via the extlinux OVERLAYS key — require reboot)
# Pins resolved from the NVIDIA Orin NX/Nano Pinmux Template v1.2 (signal names):
#   GPIO07 (SODIMM 206) -> GPIO3_PG.06 (soc_gpio19_pg6) -> 1PPS in    [hand overlay]
#   GPIO12 (SODIMM 218) -> GPIO3_PN.01 (soc_gpio39_pn1) -> PWM, hdr pin 15 [jetson-io]
# (The PPS was planned on GPIO11 / PQ.06; the harness landed it on GPIO07.
#  Both pads sit on the 1.8 V vddio_g4 rail at the SoC.)
# =============================================================================
# --- pps-gpio (GPIO07): hand-written overlay (pps-gpio node -> &gpio PG.06) ---
dt_pps_sodimm_signal: "GPIO07 (SODIMM 206)"
dt_pps_gpio_port: "G"             # Tegra234 main GPIO port
dt_pps_gpio_offset: 6             # line within the port (PG.06)
dt_pps_dt_pin_name: "soc_gpio19_pg6"
# dt-bindings include dir — needed to preprocess the pps overlay's tegra234 macros.
kernel_dt_include_dir: ""         # TODO: L4T kernel source include/ dir (has tegra234-gpio.h)
# --- pwm (GPIO12): jetson-io-generated overlay, committed at files/pwm-hdr40.dts
#     nvidia,function = "gp" (the GP_PWM1 group); PWM controllers already enabled.
# --- compiled outputs + apply (extlinux OVERLAYS, boot-critical) ---
dt_overlay_src_dir: "/boot/uav-overlays"
dt_pps_dtbo: "/boot/uav-pps-gpio.dtbo"
dt_pwm_dtbo: "/boot/uav-pwm-hdr40.dtbo"
dt_overlay_dtbos:
  - "{{ dt_pwm_dtbo }}"
  - "{{ dt_pps_dtbo }}"
extlinux_conf: "/boot/extlinux/extlinux.conf"
# The overlays live in the entry L4T itself keeps as DEFAULT: its kernel
# postinst hook (nv-update-extlinux) resets DEFAULT to "primary" on every kernel
# update — which is how a 39.2.0 -> 39.2.1 upgrade silently dropped overlays
# kept in jetson-io's "JetsonIO" entry.
dt_extlinux_label: "primary"
dt_base_dtb: "/boot/dtb/kernel_tegra234-p3768-0000+p3767-0000-nv.dtb"

# =============================================================================
# time_sync  (GNSS SOCK + PPS -> chrony -> phc2sys -> ptp4l gPTP grandmaster)
# =============================================================================
pps_device: "/dev/gnss-pps"     # udev name for the pps-gpio source (device_tree
                                # role): /dev/pps0 is the kernel's ktimer test source
chrony_serve_subnets:           # who may pull NTP from us
  - "192.168.144.0/24"
ptp_domain: 0
ptp_profile: "gPTP"             # 802.1AS, for the Robosense E1R
ptp_grandmaster_interface: "{{ ptp_interface }}"   # i226 carries the GM PHC
# phc2sys initialises the PHC from the system clock once and then only slews
# (i226: at most 6.25 %). A cold power-off loses this carrier's RTC, so the
# boot clock is 1970 until chrony steps it (NTP on the bench, GNSS in the
# field); a PHC set from that clock never catches up (observed: 56 years
# behind, ETA ~900 years). Two guards (uav-phc2sys.service.j2):
phc2sys_waitsync_tries: 12          # wait up to tries x 10 s for chrony to be
phc2sys_waitsync_max_correction: 1.0  # synchronised within this many seconds
                                    # before the PHC is initialised (non-fatal)
phc2sys_step_threshold: 1.0         # -S: step the PHC when the system clock
                                    # is later stepped by more than this

# PTP master for the Livox Avia on the drone LAN (time_sync role): ptpd with
# software time stamps on the r8168, UDPv4 E2E, master only, never adjusts the
# system clock. It announces the PTP timescale, the only one the Avia locks to,
# so it sends TAI: avia_ptp_utc_offset_sec (avia role) must equal the offset
# here. Off since 2026-10-04: the Avia gets the receiver's PPS on its Sync pair
# plus the UTC push, and Livox ranks PTP above GPS, so a running master would
# mask that path. Set true only to fall back to PTP on the bench.
avia_ptp_enabled: false
avia_ptp_interface: "{{ lan_interface }}"
avia_ptp_domain: 0
avia_ptp_utc_offset: 37

# =============================================================================
# gnss  (one reader on the receiver's data port; a read-only fan-out serves it)
# The receiver speaks SBF only: the ROS driver needs it for full covariances,
# and the time is read from it too (uav-gnss-time: ReceiverTime -> chrony).
# A u-blox bench unit still gets /dev/gnss and the fan-out, but no GNSS time
# source: chrony stays on the network pool.
# =============================================================================
gnss_serial: "/dev/gnss"        # the fan-out opens this (the udev symlink below).
                                # For first bench bring-up before the udev rule,
                                # set to the raw path: ls /dev/ttyACM* /dev/ttyUSB*
gnss_baud: 115200               # ignored by USB CDC receivers (both below)
gnss_udev_symlink: "gnss"       # udev creates /dev/gnss
# Receivers the udev rule recognises: USB vendor ID plus the CDC interface that
# carries the data stream. /dev/gnss points at whichever is plugged in.
# Septentrio exposes two: 02 (USB2) streams SBF out, 00 (USB1) is the command
# port, which drone-link holds to write RTCM in. u-blox exposes one.
# `lsusb` for the VID, `udevadm info` for the interface.
gnss_udev_receivers:
  - { vendor: "152a", interface: "02", name: "Septentrio mosaic (production)" }
  - { vendor: "1546", interface: "00", name: "u-blox X20P / F9P (bench)" }
gnss_broker_port: 28785         # the fan-out's localhost port, READ-ONLY:
                                # the time feed, the ROS driver and diagnostics
                                # read the SBF stream here; what a client sends
                                # is discarded (RTCM goes in on USB1).
gnss_time_sock: "/run/chrony.gnss.sock"  # chrony's SOCK refclock; chronyd
                                # creates it (AppArmor allows /run/chrony.*.sock)
gnss_time_offset: 0.0           # seconds added to each GNSS time sample: its
                                # arrival latency. Calibrate once PPS is the
                                # selected source: `chronyc sources` then shows
                                # the GPS line's offset, which is this latency.
# RTK corrections: drone-link, enrolled by the station's one-liner AFTER this
# converge (README, "RTK corrections"). Deliberately not an Ansible artifact:
# the enrollment spends a single-use token and mints a key, so a converge cannot
# replay it, and a YAML copy of the bootstrap would be drift. Ansible never
# touches /etc/drone-link.

# =============================================================================
# ros2
# =============================================================================
ros2_apt_packages:
  - "ros-{{ ros_distro }}-ros-base"
  - "ros-dev-tools"
ros2_setup_global: true         # source /opt/ros/<distro> from /etc/profile.d

# =============================================================================
# px4_link  (Micro XRCE-DDS Agent over UDP — the Ethernet DDS transport)
# PX4 is at 192.168.144.2 and connects to this agent at 192.168.144.1:8888.
# (PX4-side: set UXRCE_DDS_AG_IP=192.168.144.1, UXRCE_DDS_PRT=8888.)
# The agent binds all interfaces (udp4), so no bind address is needed here.
# =============================================================================
xrce_agent_repo: "https://github.com/eProsima/Micro-XRCE-DDS-Agent.git"
# PX4 1.17 uses XRCE client 2.x; Jazzy requires the 2.4.3 agent / Fast DDS 2.14.
xrce_agent_version: "v2.4.3"
xrce_agent_transport: "udp4"
xrce_agent_port: 8888
px4_ip: "192.168.144.2"
# FMU Ethernet transmit keepalive (uav-xrce-keepalive): a stream of ICMP echo
# requests to PX4. Measured 2026-09-30 on fmu-v6x: with a quiet link the XRCE
# data leaves the FMU in ~10 bursts/s with gaps up to 450 ms (vehicle_attitude
# arriving at 8.5 Hz, timesync RTT 371 ms); with 50 Hz of pings, 25 bursts/s
# and a worst gap of 34 ms. Cause: NuttX queues UDP sends in write buffers that
# the STM32H7 Ethernet driver drains only on a device poll, and its
# "Tx available" notification is dropped whenever the poll work item is busy,
# so queued data waits for the next inbound frame's TX-complete poll (roles/
# px4_link/README.md). ~27 kbit/s of ICMP. 0 disables the unit.
px4_link_keepalive_interval_ms: 20

# =============================================================================
# mavlink_router  (MAVLink hub: PX4 <-> GCS (QGC) <-> onboard apps)
# PX4 side = the baseboard's internal UART: Pixhawk TELEM2 <-> Jetson UART1
# (/dev/ttyTHS1). PX4 drives it with its TELEM2 MAVLink instance (stock
# fmu-v6x: MAV_1_CONFIG=102); SER_TEL2_BAUD must equal the baud below.
# Why the UART and not PX4's Ethernet MAVLink instance (bench, 2026-09-30):
#   - A UDP MAVLink instance LATCHES the first peer that talks to it (3 s after
#     the instance starts) and unicasts only to that address:port until PX4
#     reboots. Any GCS on the drone LAN (the Siyi's) can win that race, and
#     the router is then deaf until the next FC reboot. A UART has one peer.
#   - PX4's Ethernet transmit path on fmu-v6x is starved: NuttX queues UDP
#     sends in a 24-IOB pool that the XRCE-DDS client already fills, and the
#     STM32H7 driver drains it only on a device poll (see px4_link_keepalive).
#     MAVLink on the UART leaves that path to XRCE alone.
# The "udp" link keeps the fixed-port server-endpoint answer to the latch race
# (a Normal/client endpoint never binds, so each router restart would talk
# from a new ephemeral port and PX4 would keep sending to the dead one).
# Rule either way: nothing but this router talks to PX4 MAVLink directly.
# With the UART in use, retire the Ethernet instance on the FC (this FC:
# MAV_0_CONFIG=0) so it stops broadcasting and stops competing for IOBs.
# =============================================================================
mavlink_router_repo: "https://github.com/mavlink-router/mavlink-router.git"
# v4 (2023-11) + 16 commits. v4 itself fails on Noble's GCC 13: src/dedup.h
# uses uint32_t with only <memory> included, which no longer drags in <cstdint>.
mavlink_router_version: "2362c620f483cef1edd574fb962a373a288e4b9e"
mavlink_router_px4_link: "serial"   # "serial" = TELEM2 UART below; "udp" = PX4 Ethernet instance
mavlink_router_px4_serial_device: "/dev/ttyTHS1"   # Jetson UART1 = Pixhawk TELEM2 (baseboard-internal)
mavlink_router_px4_serial_baud: 921600             # = PX4 SER_TEL2_BAUD
mavlink_router_px4_port: 14550      # udp link only: = PX4 MAV_n_REMOTE_PRT (where PX4 broadcasts)
mavlink_router_tcp_port: 5760       # GCS: QGC -> Comm Links -> TCP -> <jethawk>:5760
mavlink_router_onboard_port: 14540  # onboard apps listen on 127.0.0.1:14540 (MAVSDK default)
mavlink_router_dedup_ms: 100        # udp link only: PX4 unicast + broadcast copies (main.conf.j2)
# The endpoint whose heartbeat carries this system id receives every message the
# router sees (mavlink-router SnifferSysid): the health node's PX4 input guard
# uses it to report any command, mode, parameter or setpoint written by a
# companion-side source. Must equal ros_health_mavlink_source_system.
mavlink_router_sniffer_sysid: "{{ ros_health_mavlink_source_system | default(254) }}"
# UDP GCS targets the router pushes to; QGC auto-connects on its default 14550.
# For the flight GCS on the drone segment (read the handheld's own address):
#   - { name: "siyi", address: "192.168.144.X", port: 14550 }
# A bench laptop's DHCP address belongs in /etc/mavlink-router/config.d/, not here.
mavlink_router_gcs_endpoints: []

# =============================================================================
# rt_tuning  (soft-RT: isolation, SCHED_FIFO, mlock, IRQ affinity, governor)
# =============================================================================
rt_cpu_governor: "performance"
rt_isolated_cpus: ""            # e.g. "4,5"; "" = no isolation
rt_preempt_full: false          # PREEMPT_DYNAMIC boot toggle (cheap A/B)
rt_memlock_unlimited: true      # raise memlock + rtprio limits for target_user

# =============================================================================
# Parked roles (opt-in only)
# =============================================================================
enable_rt_kernel: false

# =============================================================================
# D555 native ROS2 RGB -> NVENC RTSP + MAVLink Camera Protocol v2
# =============================================================================
mavlink_camera_root: "/home/{{ target_user }}/uav-camera"
mavlink_camera_storage: "/home/{{ target_user }}/camera-media"
mavlink_camera_image_topic: "/realsense/D555_261622302751_Color"
mavlink_camera_ros_domain: 0
mavlink_camera_lan_mtu: 9000       # D555 nativeDDS ingress only; RTP packets <=1200B
mavlink_camera_codec: "h265"      # h264 is the compatibility alternative
# H.265 at the D555's native colour profile (below). The UniRC 7 Pro carries
# 65 Mbit/s and decodes 4K30; 8 Mbit/s is generous for 1280x800@30 and leaves
# the link for telemetry. Raise for detail, lower for range.
mavlink_camera_bitrate: 8000000
mavlink_camera_fps: 30
# The same NVENC access units, republished as foxglove_msgs/CompressedVideo
# for the Foxglove dashboard (format = mavlink_camera_codec). Never point a
# panel at the D555's own /realsense/<serial>_Color/compressed or /h264: a
# single subscriber there throttles the imager (and so RTSP) to ~3.5 fps and
# the camera replays stale width*height-byte buffers (measured 2026-09-30).
mavlink_camera_video_topic: "/d555/color/video"
mavlink_camera_video_frame_id: "camera_color_optical_frame"   # label only; the image is rotated by mavlink_camera_rotation_degrees
# The bag's lossless colour record (2026-10-05): every frame the camera sends,
# as sensor_msgs/Image (yuv422_yuy2, 1280x800, 30 Hz, ~61 MB/s, unrotated so it
# matches /d555/color/camera_info), header mapped to UTC like the video. Published
# by this node because the camera unicasts a copy per reader and this node is its
# one colour reader. For neural reconstruction (NuRec), calibration, training.
mavlink_camera_raw_topic: "/d555/color/image"
# The D555 is a ROS 2 node; its stream profiles are ROS parameters
# (`ros2 param describe /D555_<serial> RGB.Profile` lists the choices). The RGB
# imager is 1280x800; the camera shipped streaming 896x504. A user-scope unit
# (uav-d555-profile) sets these at boot so the camera state is declared here,
# not left to whatever the camera remembers. Bandwidth: 1280x800 YUY2 at 30 Hz
# is ~500 Mbit/s per subscriber, which is why the camera pipeline is the colour
# stream's only reader (health watches CameraInfo; nvblox is retired) and
# republishes the raw frames itself for the bag (mavlink_camera_raw_topic).
d555_serial: "261622302751"
d555_rgb_profile: "yuv, 1280, 800, 30"
d555_depth_profile: "z16, 896, 504, 30"
# Stereo IR for VSLAM (same stereo module, so the depth resolution and rate).
# The emitter is off: its dot pattern moves with the camera and would be
# tracked as features, and nothing consumes depth any more.
d555_ir_profile: "y8, 896, 504, 30"
d555_emitter_mode: "Off"
d555_profile_attempts: 30              # x 10 s: the camera may boot after the Jetson
# The bag's copy of the stereo IR pair (roles/d555_relay, 2026-10-05). The camera
# unicasts a copy per reader (the port measured 747 Mbit/s of its ~940 with one
# reader per stream), so the relay is the one camera-side reader of Infrared_1/2
# and republishes them under /d555/infra{1,2} (image + camera_info, UTC stamps
# through /d555/clock, canonical frame ids) for the recorder and every offline
# consumer: VSLAM replay, calibration, neural reconstruction. Lazy: the camera is
# read only while an output has a reader, so between bags the pair costs nothing.
d555_relay_lazy: true
mavlink_camera_rtsp_port: 8554
# Host part of the advertised stream URI (VIDEO_STREAM_INFORMATION). The server
# binds every interface. Advertise the drone-LAN address: QGC on the Siyi GCS
# reaches it natively over the datalink (it has no resolver for the Jetson's
# name), and QGC anywhere on the tailnet reaches the same address through the
# Jetson's /32 tailnet route (tailscale_advertise_routes), on wifi or the GCS
# alike. No URI that only works on one path.
mavlink_camera_rtsp_host: "{{ lan_address.split('/')[0] }}"
mavlink_camera_system_id: 1
mavlink_camera_component_id: 100
mavlink_camera_rotation_degrees: 180
# Transmitter buttons served by the camera component, read from the
# autopilot's RC_CHANNELS (0 disables): photo, and start/stop recording.
# "button" acts on a momentary press; "toggle" on every flip of a latching
# button or switch.
mavlink_camera_rc_photo_channel: 12
mavlink_camera_rc_video_channel: 13
mavlink_camera_rc_button_mode: button

# The camera's second stream: the LiDAR map view (roles/lidar_view). FAST-LIO's
# map, the live Avia and E1R scans and the X950 seen from a chase camera,
# rendered on the GPU and NVENC-encoded like the RGB stream; rendered only
# while a client plays it. QGC lists both streams in the camera's stream
# selector (one at a time). With lidar_view_qgc_overlay the stream is flagged
# "thermal" instead, and QGC overlays it on the RGB stream, both at once, in
# the camera's thermal view mode (picture-in-picture, blend or full).
lidar_view_state: present
lidar_view_rtsp_port: 8555
lidar_view_rtsp_path: /lidar
lidar_view_width: 1280
lidar_view_height: 720
lidar_view_fps: 30
lidar_view_bitrate: 4000000
lidar_view_fovy_deg: 50
lidar_view_hfov_deg: 79                  # 2 atan(tan(fovy / 2) * width / height)
lidar_view_qgc_overlay: false
mavlink_camera_extra_streams: >-
  {{ [] if lidar_view_state != 'present' else [{
  'name': 'LiDAR map',
  'uri': 'rtsp://' ~ mavlink_camera_rtsp_host ~ ':' ~ lidar_view_rtsp_port ~ lidar_view_rtsp_path,
  'codec': mavlink_camera_codec, 'width': lidar_view_width | int, 'height': lidar_view_height | int,
  'fps': lidar_view_fps | int, 'bitrate': lidar_view_bitrate | int, 'hfov_deg': lidar_view_hfov_deg | int,
  'thermal': lidar_view_qgc_overlay | bool, 'probe': '127.0.0.1:' ~ lidar_view_rtsp_port}] }}

# =============================================================================
# px4_bridge  (uORB -> ROS-native ENU/FLU), gnss_ros (Septentrio ROS 2 driver
# on the SBF fan-out), localization (robot_localization, informational).
# PX4's own EKF output is republished for comparison, never fused; GNSS comes
# from the Jetson's receiver (full covariances), never from PX4.
# =============================================================================
px4_bridge_prefix: "/px4"
px4_bridge_imu_frame: "fmu_housing_link"   # URDF frame of the Pixhawk housing (not IMU-calibrated)
px4_bridge_odom_frame: "px4_local"         # PX4 EKF2's own local frame, distinct from our odom/map
# PPS edges captured by PX4 (pps_capture on FMU_CAP1, custom firmware) measure
# the XRCE timesync error against UTC; the bridge reports it in px4/bridge and,
# when true, subtracts the median residual from every republished stamp.
px4_bridge_pps_correct_stamps: true
gnss_ros_namespace: "/gnss"
gnss_ros_frame_id: "gnss_main_link"
gnss_ros_aux1_frame_id: "gnss_aux_link"
localization_imu_topic: "/px4/imu/data"
localization_gps_topic: "/gnss/navsatfix"

# =============================================================================
# ROS inspection services (systemd system units, unprivileged runtime account)
# =============================================================================
uav_ros_user: "uav-ros"
uav_ros_workspace: "/opt/uav/ros"
uav_ros_environment_file: "/etc/uav/ros/environment"
uav_ros_domain: 0
# DDS socket receive buffers. The D555 delivers ~200 Mbit/s per image
# subscription in 9 kB datagrams; the kernel default (net.core.rmem_max
# 212992) is 1.8 ms of that, and every scheduling hiccup dropped fragments
# (nvblox: 8.4 k dropped datagrams in one boot). Cyclone asks for the size
# below (best effort: it settles for the kernel ceiling, so services never
# fail on a box without the sysctl); the sysctl lets it have it.
dds_socket_rcvbuf: "16MB"
dds_rmem_max: 33554432
# Every interface, like the router's TCP port: Foxglove on the house Wi-Fi
# connects to ws://jethawk:8765 and a GCS on the Siyi link to the drone-LAN
# address, with no host route or tunnel. The bridge has no authentication:
# it is reachable by whoever can reach the Jetson. Set the drone-LAN address
# here to confine it to that segment again.
foxglove_bind_address: "0.0.0.0"
foxglove_port: 8765
# Per-client send queue (messages). Must exceed the number of meshes in the
# URDF (42) plus the images a layout streams while a model loads; the SDK
# disconnects a client whose queue cannot take a fetch-asset response. Larger
# values delay health messages behind queued images on a saturated link.
foxglove_message_backlog_size: 128
# Dashboard depth: the D555 has no compressed depth, so a topic_tools relay
# republishes the single raw copy at this rate for Foxglove (colour uses the
# camera's own H.264 stream).
foxglove_depth_throttle_hz: 0.0   # off since 2026-10-02: nothing consumes depth; the port's headroom carries the IR pair (bagged raw via d555_relay)
# The airframe description (Blender + LinkForge authoring, exported ROS
# package) lives in this repository: x950_description/ at the root.
# Flight recorder: rosbag2 (mcap) of every flight on the NVMe root, armed -> safed.
# The camera's own /realsense topics are excluded (a reader there is another
# unicast copy on the port); the stereo IR pair and the colour stream ARE
# recorded, raw, through their single-reader copies: /d555/infra*/image
# (d555_relay) and /d555/color/image (the camera node). Since 2026-10-05.
flight_recorder_dir: /data/flights
flight_recorder_post_roll_sec: 30.0
flight_recorder_min_free_gb: 50.0
# The camera's own topics (a second reader of a stream is a second unicast copy
# on the port; the IR pair reaches the bag through the d555_relay's /d555/infra*
# copy instead, colour as the encoder's /d555/color/video) and the
# derived LiDAR clouds (~11 MB/s from FAST-LIO, ~4.4 MB/s of registered E1R;
# re-created offline from /avia/custom, /avia/imu and /e1r/points, which are
# recorded).
flight_recorder_exclude_regex: "^/(realsense/|cloud_registered|cloud_registered_body|cloud_effected|Laser_map|lio/map|lio/registered)"

# Jetson platform stats (isaac_ros_jetson_stats on jtop) -> /diagnostics
jetson_stats_interval_sec: 1.0

robot_description_source_dir: "{{ playbook_dir }}/x950_description"

# =============================================================================
# hflow  (Holybro H-Flow on the FC's CAN2 bus, which the baseboard also wires
# to the Jetson's can0). The Jetson is a LISTEN-ONLY observer: it never ACKs
# or transmits, so it cannot disturb the flight-critical DroneCAN bus that PX4
# (node 10) and the H-Flow (node 124) share. The observer decodes the flow and
# range messages with pydronecan and republishes PX4's own message types (what
# PX4 builds from the same frames) plus a sensor_msgs/Range companion.
# =============================================================================
hflow_can_interface: "can0"
hflow_can_bitrate: 1000000          # = PX4 UAVCAN_BITRATE
hflow_node_id: 124                  # DroneCAN source node accepted (0 = any)
hflow_dronecan_version: "1.0.27"
hflow_topic_prefix: "/hflow"
hflow_flow_frame: "hflow_nominal_frd_frame"      # PX4/DroneCAN sensor axes (URDF)
hflow_range_frame: "hflow_nominal_range_frame"   # +x along the beam (URDF)
hflow_range_min_m: 0.08
hflow_range_max_m: 30.0

# =============================================================================
# isaac_ros  (NVIDIA Isaac ROS apt repository + pinned perception packages)
# Isaac ROS 4.6 ships native Jazzy debs for JetPack 7.2 (noble-jetpack); there
# is no Docker in this path. Three pins make it reproducible: the release is the
# repository path, the signing key is checked by fingerprint before the keyring
# is trusted, and the package version is installed as pkg=version.
# =============================================================================
# Retired 2026-09-30 with the nvblox POC (nvblox_state stays "absent"; its code
# and findings stay in roles/nvblox/README.md). Back since 2026-10-02 for the
# vslam role: cuVSLAM on the D555's stereo IR.
isaac_ros_state: "present"
nvblox_state: "absent"
isaac_ros_release: "release-4.6"
isaac_ros_apt_suite: "noble-jetpack"
isaac_ros_key_fingerprints:
  - "428F5D2ACFBC9AA1F8EAC84658F4DA023E691207"   # Isaac ROS Buildfarm Repository Signing (2026-07-10)
  - "9EEB7195A4BD947C572666F9BBE5EA6DE681BCAB"   # Alexander Poddubny, Isaac ROS Buildfarm (2023-09-05)
isaac_ros_package_version: "4.6.0-0noble.20260818193828000"
isaac_ros_packages:
  - "ros-{{ ros_distro }}-isaac-ros-visual-slam"
# cuVSLAM off since 2026-10-05: nothing on the roadmap consumes it (nvblox is
# LiDAR-only and takes its pose from the LIO transform tree; decision 2 made it
# "evaluate only if cheap"). With the IR pair in the bag (d555_relay) it is
# evaluated offline on the replay host instead. Its units stay installed.
vslam_enabled: false

# =============================================================================
# nvblox  (Isaac ROS 3D reconstruction: D555 depth + colour and Avia LiDAR
# fused into one GPU TSDF; coloured surface voxels + 3D ESDF for Foxglove and
# for a future planner). Long-tail tunables: roles/nvblox/defaults/main.yml.
#
# POSE SOURCE IS A BENCH STAND-IN: uav-bench-odom publishes a static identity
# odom->base_link. nvblox therefore maps a static scene from a static aircraft.
# Replace it with real odometry (PX4 EKF2 bridge or cuVSLAM) before flight and
# set nvblox_bench_static_odom to false; nothing else in the config changes.
#
# Time bases: the D555 stamps in device uptime, the Avia in host receipt time,
# nvblox output in ROS time. With an all-static TF tree that is harmless; the
# moment odom->base_link moves, every sensor stamp must be in ROS/UTC time.
# =============================================================================
nvblox_bench_static_odom: true
nvblox_d555_serial: "261622302751"
nvblox_use_color: true
nvblox_use_lidar: true
nvblox_voxel_size_m: 0.05
nvblox_esdf_mode: "3d"
nvblox_map_clearing_radius_m: 15.0
# Avia through nvblox's spinning-LiDAR model: a 360 deg x vfov equiangular grid
# of which the Avia fills a ~70x77 deg patch. Every point must fall inside the
# vertical FOV or the whole cloud is rejected (measured +-37.5 deg, spec 77.2
# deg total). The nearest-pixel fallback accepts a voxel only within 0.5 voxel
# of the pixel-centre ray, so the angular pixel must stay finer than about
# voxel/(sqrt(2) R): 0.40 deg/px is right to ~5 m at 5 cm voxels; for outdoor
# ranges use width 1800/height 400 (0.20 deg/px) or 10 cm voxels.
nvblox_lidar_width: 900                   # must be even
nvblox_lidar_height: 200                  # = vfov / (360 / width)
nvblox_lidar_vertical_fov_deg: 80.0
nvblox_depth_max_integration_distance_m: 6.0    # D555 stereo depth trust horizon
nvblox_lidar_max_integration_distance_m: 20.0   # Avia (450 m spec; bench room ~4 m)

# rclpy's experimental EventsExecutor on every Python node (UAV_EVENTS_EXECUTOR=1
# in their units): callbacks run from DDS events instead of a polled wait set.
# Measured 2026-10-04 on the health node: 58 % of a core with the default
# executor, 15.7 % with this one, every row unchanged (per-node figures in
# docs/ros-bench.md, "Executor A/B").
ros_events_executor: true
# The D555 frame adapter crash-loops under the EventsExecutor (rclpy 7.1.12:
# "SystemError: null argument to internal routine" on start, 2026-10-04); it
# keeps the default executor until that is understood.
foxglove_d555_frames_events_executor: false
