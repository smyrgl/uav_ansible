---
# mavlink-router — the MAVLink hub. ONE link to PX4 (Ethernet/UDP), fanned out
# to GCSs (QGC over TCP, or pushed UDP) and to onboard apps (MAVSDK, pymavlink).
# Why the PX4 side is a fixed-port *server* endpoint: see group_vars (PX4
# latches the first UDP peer it hears from, for as long as it stays up).
- name: Install build dependencies
  ansible.builtin.apt:
    name:
      - git
      - g++
      - meson
      - ninja-build
      - pkg-config
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Fetch mavlink-router source (pinned; pulls the mavlink C library submodule)
  ansible.builtin.git:
    repo: "{{ mavlink_router_repo }}"
    dest: /opt/mavlink-router
    version: "{{ mavlink_router_version }}"
    recursive: true
  register: mavlink_router_src

- name: Check for an installed mavlink-routerd
  ansible.builtin.stat:
    path: /usr/local/bin/mavlink-routerd
  register: mavlink_routerd_bin

# Rebuilds when the pin moves, not just when the binary is missing. Only the
# binary is installed: `ninja install` would also drop upstream's
# mavlink-router.service beside ours — two routers racing for the same ports.
- name: Build + install mavlink-routerd
  ansible.builtin.shell:
    cmd: |
      set -e
      rm -rf build
      meson setup build . -Dsystemdsystemunitdir=/usr/lib/systemd/system
      ninja -C build
      install -m 0755 build/src/mavlink-routerd /usr/local/bin/mavlink-routerd
    chdir: /opt/mavlink-router
  when: mavlink_router_src is changed or not mavlink_routerd_bin.stat.exists
  notify: Restart mavlink-router

# config.d/ is read after main.conf and may add to or override it: the place for
# local, unmanaged additions such as a bench laptop's UDP endpoint.
- name: Create the config directories
  ansible.builtin.file:
    path: /etc/mavlink-router/config.d
    state: directory
    mode: "0755"

- name: Configure mavlink-router
  ansible.builtin.template:
    src: main.conf.j2
    dest: /etc/mavlink-router/main.conf
    mode: "0644"
  notify: Restart mavlink-router

- name: Install the mavlink-router systemd unit
  ansible.builtin.template:
    src: uav-mavlink-router.service.j2
    dest: /etc/systemd/system/uav-mavlink-router.service
    mode: "0644"
  notify: Restart mavlink-router

- name: Enable mavlink-router
  ansible.builtin.systemd:
    name: uav-mavlink-router.service
    enabled: true
    state: started
    daemon_reload: true
