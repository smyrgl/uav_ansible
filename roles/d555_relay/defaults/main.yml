---
# The bag's copy of the D555 stereo IR pair. The camera is its own DDS publisher
# and unicasts a private copy of each stream to every reader over the aircraft's
# single 1 GbE port, so a second reader of the pair (the flight recorder next to
# cuVSLAM) would push the port past its ceiling. The relay is the one camera-side
# reader of Infrared_1/2 and republishes them locally, where any number of
# consumers read them at zero link cost.
d555_relay_state: present                 # present | absent
d555_relay_service_user: "{{ uav_ros_user | default('uav-ros') }}"
d555_relay_environment_file: "{{ uav_ros_environment_file | default('/etc/uav/ros/environment') }}"
d555_relay_serial: "{{ d555_serial | default('261622302751') }}"
d555_relay_prefix: /d555                  # outputs: <prefix>/<name>/image and <prefix>/<name>/camera_info
d555_relay_clock_topic: /d555/clock       # the adapter's device-clock -> UTC model (foxglove role)
d555_relay_clock_max_age_s: 5.0           # older model: frames are stamped with their receipt time instead
d555_relay_lazy: true                     # read the camera only while an output has a reader
d555_relay_release_after_s: 5             # lazy: exit (systemd restarts it idle) after this long without a reader;
                                          # the camera keeps sending to a destroyed reader, only a new participant stops it
d555_relay_streams:                       # name, the camera's topic suffix, the frame id the camera labels it with
  - { name: infra1, source: Infrared_1, frame: camera_infra1_optical_frame }
  - { name: infra2, source: Infrared_2, frame: camera_infra2_optical_frame }
