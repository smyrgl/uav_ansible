---
ros_health_user: uav-ros
ros_health_workspace: /opt/uav/ros
ros_health_environment: /etc/uav/ros/environment
ros_health_config: /etc/uav/ros/health.yaml
ros_health_d555_serial: "261622302751"
ros_health_d555_color_topic: /d555/color   # the D555 adapter's UTC-stamped relays
ros_health_d555_depth_topic: ""   # "" = not monitored: no depth consumer since 2026-10-02 (the port carries the IR pair instead, bagged raw by d555_relay)
ros_health_d555_camera_info_suffix: /camera_info   # watched instead of the images (bandwidth)
ros_health_receipt_timeout_sec: 2.0
ros_health_startup_grace_sec: 10.0
ros_health_min_rate_hz: 15.0
ros_health_rate_window_sec: 5.0
ros_health_clock_tolerance_sec: 2.0
ros_health_venv: /opt/uav/health-venv
ros_health_pymavlink_version: "2.4.49"
ros_health_avia_topic: /avia/points
ros_health_e1r_topic: /e1r/points
ros_health_mavlink_endpoint: tcp:127.0.0.1:5760
ros_health_mavlink_source_system: 254
ros_health_hflow_flow_topic: /hflow/sensor_optical_flow   # from uav-hflow (CAN listener)
ros_health_hflow_range_topic: /hflow/range
ros_health_hflow_min_quality: 20
ros_health_gnss_broker_port: 28785
# This airframe navigates on RTK: anything below RTK fixed is a WARN on the
# GNSS row (float, DGNSS, stand-alone). Set false for a non-RTK build.
ros_health_gnss_require_rtk_fixed: true
ros_health_ptp_status_path: /run/uav/time/ptp-status.json
# Official release/1.17, matching the Pixhawk firmware's message generation.
ros_health_px4_workspace: /opt/uav/px4_msgs
ros_health_px4_msgs_revision: 86d8239e962f6939e05c3737784f60c02fa884db
# PX4 input guard ("PX4 / Guard" row; autonomy roadmap Stage 0b). The /fmu/in
# topics the flashed firmware may subscribe to (uav/v1.17.0-pps keeps only the
# message-format request); the uORB topics whose px4_msgs definition is checked
# against the FC's message hash; the MAVLink system ids that may send commands,
# modes, parameters or setpoints (the ground station). Everything else that
# writes is reported; the router forwards all traffic to the health node's
# system id for this (mavlink_router_sniffer_sysid).
ros_health_guard_expected_readers: ["/fmu/in/message_format_request"]
ros_health_guard_hash_topics: [vehicle_status, vehicle_attitude, vehicle_local_position, vehicle_odometry,
                               sensor_combined, timesync_status, sensor_gps, battery_status, pps_capture,
                               vehicle_local_position_setpoint, trajectory_setpoint, offboard_control_mode,
                               vehicle_command, obstacle_distance, message_format_request, message_format_response]
ros_health_guard_mavlink_gcs_systems: [255]
ros_health_guard_hash_timeout_sec: 120.0
