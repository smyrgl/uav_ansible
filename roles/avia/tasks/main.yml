---
- name: Install Avia ROS build dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake
      - git
      - python3-colcon-common-extensions
      - "ros-{{ ros_distro }}-ament-cmake"
      - "ros-{{ ros_distro }}-rclcpp"
      - "ros-{{ ros_distro }}-sensor-msgs"
      - "ros-{{ ros_distro }}-diagnostic-msgs"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Prepare Avia workspace directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ avia_workspace }}/src"
    - "{{ avia_workspace }}/vendor"

- name: Fetch the pinned original Livox SDK
  ansible.builtin.git:
    repo: "{{ avia_sdk_repository }}"
    dest: "{{ avia_workspace }}/vendor/Livox-SDK"
    version: "{{ avia_sdk_revision }}"
    update: true
  register: avia_sdk_source
  notify: Restart Avia ROS driver

- name: Install the Avia ROS adapter source
  ansible.builtin.copy:
    src: uav_avia
    dest: "{{ avia_workspace }}/src/"
    owner: root
    group: root
    mode: preserve
  register: avia_adapter_source
  notify: Restart Avia ROS driver

- name: Check for the Avia executable
  ansible.builtin.stat:
    path: "{{ avia_workspace }}/install/lib/uav_avia/avia_node"
  register: avia_executable

- name: Build Avia and verify its point data contract
  ansible.builtin.shell: |
    set -e
    source /opt/ros/{{ ros_distro }}/setup.bash
    colcon build --merge-install --packages-select uav_avia --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    ctest --test-dir build/uav_avia --output-on-failure
  args:
    executable: /bin/bash
    chdir: "{{ avia_workspace }}"
  when: avia_sdk_source is changed or avia_adapter_source is changed or not avia_executable.stat.exists
  notify: Restart Avia ROS driver

- name: Configure the Avia driver
  ansible.builtin.template:
    src: avia.yaml.j2
    dest: /etc/uav/ros/avia.yaml
    mode: "0644"
  notify: Restart Avia ROS driver

- name: Install the persistent Avia service
  ansible.builtin.template:
    src: uav-avia.service.j2
    dest: /etc/systemd/system/uav-avia.service
    mode: "0644"
  notify: Restart Avia ROS driver

- name: Apply Avia changes before starting
  ansible.builtin.meta: flush_handlers

- name: Enable Avia at boot
  ansible.builtin.systemd_service:
    name: uav-avia.service
    enabled: true
    state: started
    daemon_reload: true
