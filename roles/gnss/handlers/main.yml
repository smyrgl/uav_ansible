---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload udev
  # reload alone only affects future events; trigger re-runs the rules for the
  # receiver that is already plugged in, so /dev/gnss appears without a replug.
  ansible.builtin.shell:
    cmd: udevadm control --reload-rules && udevadm trigger --subsystem-match=tty --action=add
  changed_when: true

- name: Restart gnss broker
  ansible.builtin.systemd:
    name: uav-gnss-broker.service
    state: restarted
    daemon_reload: true

- name: Restart gnss time feed
  ansible.builtin.systemd:
    name: uav-gnss-time.service
    state: restarted
    daemon_reload: true

- name: Load cdc_acm now
  community.general.modprobe:
    name: cdc_acm
    state: present
