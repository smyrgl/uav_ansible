---
# The broker owns ONE receiver serial and tees it: a read-broadcast port (gpsd
# for time now; the ROS driver joins the same stream later) + a write port for
# RTCM injection. Single owner => clean tee + serialized writes. Works for the
# Septentrio G5 (production) or a UM982 (bench) — gpsd auto-detects NMEA vs SBF,
# so the time path is identical either way.
- name: Install gpsd + broker deps
  ansible.builtin.apt:
    name:
      - gpsd
      - gpsd-clients
      - python3-serial
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install udev rule for a stable GNSS symlink
  ansible.builtin.template:
    src: 99-gnss.rules.j2
    dest: /etc/udev/rules.d/99-gnss.rules
    mode: "0644"
  notify: Reload udev

- name: Install the GNSS serial broker
  ansible.builtin.copy:
    src: uav-gnss-broker.py
    dest: /usr/local/bin/uav-gnss-broker.py
    mode: "0755"
  notify: Restart gnss broker

- name: Install the broker systemd unit
  ansible.builtin.template:
    src: uav-gnss-broker.service.j2
    dest: /etc/systemd/system/uav-gnss-broker.service
    mode: "0644"
  notify: Restart gnss broker

- name: Enable the GNSS broker
  ansible.builtin.systemd:
    name: uav-gnss-broker.service
    enabled: true
    state: started
    daemon_reload: true

- name: Configure gpsd (reads the broker's read-broadcast port)
  ansible.builtin.template:
    src: gpsd.default.j2
    dest: /etc/default/gpsd
    owner: root
    group: root
    mode: "0644"
  notify: Restart gpsd

- name: Enable gpsd
  ansible.builtin.systemd:
    name: gpsd
    enabled: true
    state: started
    daemon_reload: true

# --- Next pieces (not required for the PTP/time path) ------------------------
- name: Note — NTRIP client + ROS driver
  ansible.builtin.debug:
    msg: >-
      NTRIP (write path): point an NTRIP client (e.g. RTKLIB str2str) at the
      broker write port {{ gnss_broker_write_port }} to inject RTCM — de-risks RTK
      but is not needed for time. ROS: the Septentrio/Unicore driver reads
      tcp://127.0.0.1:{{ gnss_broker_read_port }} (read-only) at the ROS2 stage.
