---
# Path B: the mosaic-G5 exposes a single serial port (no virtual COMs), so one
# broker process owns it and tees SBF over TCP to two read-only consumers —
# gpsd (time + the ONLY writer, for NTRIP->RTCM) and the Septentrio ROS driver
# (rich data, in the app repo). See README "Architecture decisions".
- name: Install gpsd + clients
  ansible.builtin.apt:
    name:
      - gpsd
      - gpsd-clients
      - socat
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Stable device name for the Mosaic --------------------------------------
- name: Install udev rule for a stable Mosaic symlink
  ansible.builtin.template:
    src: 99-mosaic.rules.j2
    dest: /etc/udev/rules.d/99-mosaic.rules
    mode: "0644"
  notify: Reload udev

# --- Serial broker (single owner; tees reads, single arbitrated writer) ------
- name: Install GNSS serial broker script (PLACEHOLDER — needs prototyping)
  ansible.builtin.copy:
    src: uav-gnss-broker.sh
    dest: /usr/local/bin/uav-gnss-broker.sh
    mode: "0755"

- name: Install GNSS broker systemd unit
  ansible.builtin.template:
    src: uav-gnss-broker.service.j2
    dest: /etc/systemd/system/uav-gnss-broker.service
    mode: "0644"
  notify: Reload systemd
  # NOTE: intentionally NOT enabled yet — the broker script is a documented
  # placeholder. Implement it (str2str / ser2net / custom multiplexer), then
  # enable: `systemctl enable --now uav-gnss-broker`.

# --- gpsd: time SHM for chrony + NTRIP->RTCM write-back (the only writer) ----
- name: Configure gpsd (reads broker, forwards NTRIP corrections)
  ansible.builtin.template:
    src: gpsd.default.j2
    dest: /etc/default/gpsd
    owner: root
    group: root
    mode: "0644"
  notify: Restart gpsd

- name: Enable gpsd
  ansible.builtin.systemd:
    name: gpsd
    enabled: true
    state: started
    daemon_reload: true
  # gpsd will retry until the broker is up; that's expected during bring-up.

# --- Septentrio ROS driver as a boot service (optional, app-repo dependent) --
- name: Note — Septentrio driver boot unit
  ansible.builtin.debug:
    msg: >-
      TODO: once the ROS workspace exists, add a systemd unit that launches
      septentrio_gnss_driver against tcp://127.0.0.1:{{ gnss_broker_port_driver }}
      (read-only) so rich SBF data (NavSatFix + heading + covariances) is
      published at boot, independent of the main offboard app.
