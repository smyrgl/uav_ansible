---
# The broker owns ONE receiver serial and tees it on one localhost port: gpsd
# (time) and the ROS driver read the stream; drone-link-connect writes RTCM to
# it, and the broker relays writes to the serial. Single owner => clean tee +
# serialized writes. Works for the Septentrio G5 (production) or a u-blox unit
# (bench) — gpsd auto-detects NMEA/UBX/SBF, so the time path is identical.
- name: Install gpsd + broker deps
  ansible.builtin.apt:
    name:
      - gpsd
      - gpsd-clients
      - python3-serial
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install udev rule for a stable GNSS symlink
  ansible.builtin.template:
    src: 99-gnss.rules.j2
    dest: /etc/udev/rules.d/99-gnss.rules
    mode: "0644"
  notify: Reload udev

- name: Install the GNSS serial broker
  ansible.builtin.copy:
    src: uav-gnss-broker.py
    dest: /usr/local/bin/uav-gnss-broker.py
    mode: "0755"
  notify: Restart gnss broker

- name: Install the broker systemd unit
  ansible.builtin.template:
    src: uav-gnss-broker.service.j2
    dest: /etc/systemd/system/uav-gnss-broker.service
    mode: "0644"
  notify: Restart gnss broker

- name: Enable the GNSS broker
  ansible.builtin.systemd:
    name: uav-gnss-broker.service
    enabled: true
    state: started
    daemon_reload: true

- name: Configure gpsd (reads the broker's read-broadcast port)
  ansible.builtin.template:
    src: gpsd.default.j2
    dest: /etc/default/gpsd
    owner: root
    group: root
    mode: "0644"
  notify: Restart gpsd

- name: Enable gpsd
  ansible.builtin.systemd:
    name: gpsd
    enabled: true
    state: started
    daemon_reload: true

# --- ROS driver (read-only consumer, ROS2 stage) -----------------------------
- name: Note — ROS driver
  ansible.builtin.debug:
    msg: >-
      ROS2 stage: the Septentrio/Unicore driver reads
      tcp://127.0.0.1:{{ gnss_broker_port }} (read-only) for NavSatFix etc. RTCM
      arrives from drone-link-connect once the rover is enrolled from the
      station; a standalone fix is enough for the time path.
