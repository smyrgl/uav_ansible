---
# Clock daemons. The GNSS side (the fan-out that owns the receiver's data port,
# and uav-gnss-time, which turns its SBF ReceiverTime into chrony's coarse GPS
# source over the SOCK protocol) lives in the `gnss` role and runs first.
#
# Topology (see README): chrony disciplines the system clock from the GPIO PPS
# (precise) + the GNSS SOCK source (coarse) and serves NTP; phc2sys pushes the
# system clock to the i226 PHC; ptp4l distributes that PHC as a gPTP
# grandmaster.
- name: Install chrony + linuxptp
  ansible.builtin.apt:
    name:
      - chrony
      - linuxptp
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- chrony: system-clock discipline (PPS + GNSS SOCK) + NTP server ---------
- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Install the conditional PPS refclock writer
  ansible.builtin.template:
    src: uav-chrony-pps.sh.j2
    dest: /usr/local/sbin/uav-chrony-pps
    mode: "0755"
  notify: Restart chrony

- name: Create the chrony unit drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/chrony.service.d
    state: directory
    mode: "0755"

- name: Run the PPS refclock writer before chronyd starts
  ansible.builtin.template:
    src: chrony-uav-pps.conf.j2
    dest: /etc/systemd/system/chrony.service.d/uav-pps.conf
    mode: "0644"
  notify:
    - Reload systemd
    - Restart chrony

# --- ptp4l: gPTP grandmaster on the i226 segment -----------------------------
- name: Configure ptp4l (gPTP profile)
  ansible.builtin.template:
    src: ptp4l.conf.j2
    dest: /etc/linuxptp/ptp4l.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart ptp4l
    - Restart phc2sys

- name: Install ptp4l systemd unit
  ansible.builtin.template:
    src: uav-ptp4l.service.j2
    dest: /etc/systemd/system/uav-ptp4l.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart ptp4l

# --- phc2sys: system clock -> i226 PHC ---------------------------------------
- name: Install phc2sys systemd unit
  ansible.builtin.template:
    src: uav-phc2sys.service.j2
    dest: /etc/systemd/system/uav-phc2sys.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart phc2sys

- name: Enable timing services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - chrony
    - uav-ptp4l.service
    - uav-phc2sys.service

# --- PTP master for the Livox Avia (ptpd, software time stamps) --------------
# Interim time source for the Avia until its PPS input works. The Avia locks
# only to a master announcing the PTP timescale, which ptp4l cannot do on the
# system clock; ptpd can (see ptpd-avia.conf.j2). Software time stamps on the
# r8168 (no PHC): about a millisecond of receive jitter at the host, and a
# sync far inside what a 10 Hz scan needs.
- name: Install ptpd
  ansible.builtin.apt:
    name: ptpd
    state: present
    policy_rc_d: 101  # never let the package start its own service
  when: avia_ptp_enabled | bool

- name: Keep the packaged ptpd service masked
  # Its default instance would run as a slave and steer the system clock
  # against chrony. The package ships START_DAEMON=no; this makes it certain.
  ansible.builtin.systemd:
    name: ptpd.service
    enabled: false
    masked: true
  when: avia_ptp_enabled | bool

- name: Configure the Avia PTP master
  ansible.builtin.template:
    src: ptpd-avia.conf.j2
    dest: /etc/uav/ptpd-avia.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/ptpd -k -c %s
  when: avia_ptp_enabled | bool
  notify: Restart Avia PTP master

- name: Install the Avia PTP master unit
  ansible.builtin.template:
    src: uav-ptpd-avia.service.j2
    dest: /etc/systemd/system/uav-ptpd-avia.service
    mode: "0644"
  when: avia_ptp_enabled | bool
  notify:
    - Reload systemd
    - Restart Avia PTP master

- name: Retire the ptp4l-based Avia master (it cannot announce the PTP timescale)
  ansible.builtin.systemd:
    name: uav-ptp4l-avia.service
    enabled: false
    state: stopped
  failed_when: false

- name: Remove the ptp4l-based Avia master files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/uav-ptp4l-avia.service
    - /etc/linuxptp/ptp4l-avia.conf
  notify: Reload systemd

- name: Run the Avia PTP master
  ansible.builtin.systemd:
    name: uav-ptpd-avia.service
    enabled: true
    state: started
    daemon_reload: true
  when: avia_ptp_enabled | bool

- name: Stop the Avia PTP master when disabled
  ansible.builtin.systemd:
    name: uav-ptpd-avia.service
    enabled: false
    state: stopped
  failed_when: false
  when: not (avia_ptp_enabled | bool)

- name: Remove the Avia PTP master files when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/uav-ptpd-avia.service
    - /etc/uav/ptpd-avia.conf
  when: not (avia_ptp_enabled | bool)
  notify: Reload systemd
