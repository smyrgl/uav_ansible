---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart chrony
  # daemon_reload here, not via "Reload systemd": handler names are play-global
  # and the last role's copy of that one runs after this, so a new drop-in
  # would not be loaded yet.
  ansible.builtin.systemd:
    name: chrony
    state: restarted
    daemon_reload: true

- name: Restart ptp4l
  ansible.builtin.systemd:
    name: uav-ptp4l.service
    state: restarted

- name: Restart phc2sys
  ansible.builtin.systemd:
    name: uav-phc2sys.service
    state: restarted

- name: Restart Avia PTP master
  ansible.builtin.systemd:
    name: uav-ptpd-avia.service
    state: restarted
    daemon_reload: true
