---
- name: Restart lio
  ansible.builtin.systemd_service:
    name: uav-lio.service
    state: restarted
    daemon_reload: true

- name: Restart lio map
  ansible.builtin.systemd_service:
    name: uav-lio-map.service
    state: restarted
    daemon_reload: true

- name: Restart lio bridge
  ansible.builtin.systemd_service:
    name: uav-lio-bridge.service
    state: restarted
    daemon_reload: true
