---
# LiDAR-inertial odometry: FAST-LIO2 (HKU MARS) on the Livox Avia and its
# built-in IMU (/avia/custom + /avia/imu from the avia role, both on the
# Avia's PTP-locked clock). Built from source in the shared ROS workspace,
# where the avia role's livox_ros_driver2 messages live.
lio_state: present                         # present | absent
lio_service_user: "{{ uav_ros_user | default('uav-ros') }}"
lio_environment_file: "{{ uav_ros_environment_file | default('/etc/uav/ros/environment') }}"
lio_workspace: "{{ uav_ros_workspace | default('/opt/uav/ros') }}"
# GPL-2.0: fetched at build time at a pinned commit, never vendored here.
lio_repository: https://github.com/hku-mars/FAST_LIO.git
lio_revision: a4743b095409588842a5b30ddfa27e29d2f99164   # ROS2 branch, 2025-01-15 (with ikd-Tree submodule)
lio_checkout_dir: /opt/uav/vendor/FAST_LIO   # pristine, outside the colcon workspace
lio_source_dir: "{{ lio_workspace }}/src/FAST_LIO"   # the copy that is built (C++17)
lio_config_path: /etc/uav/ros/fast_lio.yaml
lio_build_jobs: 4                          # the IKFoM templates are memory-hungry

lio_lidar_topic: /avia/custom
lio_imu_topic: /avia/imu
# Avia preprocessing: FAST-LIO's own avia.yaml discards everything within 4 m.
# The Avia returns nothing closer than 1.00 m anyway (minimum range over twelve
# bags, 2026-10-06), and in the A-S+ cage no part of the airframe is in its field
# of view (integration report: 0 % at every origin), so the blind radius is the
# sensor's own. It matters on the ground: 45 deg nose-down on the skids, the Avia
# sees flat ground only out to 2.8 m, and 1.5 m left FAST-LIO a sliver of it.
lio_blind_m: 1.0
lio_point_filter_num: 3                    # every 3rd point
lio_filter_size_surf_m: 0.5
lio_filter_size_map_m: 0.5
# Geometry comes from the URDF, never from here. FAST-LIO's IMU-to-LiDAR
# extrinsic is read from TF (lio_imu_frame -> lio_lidar_frame, both published by
# robot_description) into lio_extrinsic_file before every start; the bridge, the
# E1R registration and the map view look up base_link -> lio_imu_frame.
lio_imu_frame: avia_imu
lio_lidar_frame: avia_nominal_lidar_frame
lio_extrinsic_file: /run/uav-lio/fast_lio_extrinsic.yaml
# FAST-LIO (patched at build, files/patch_fast_lio.py) exits when lost, for
# systemd to restart it: no scan matched to the map for lio_lost_exit_s of LiDAR
# time, or faster than lio_max_speed_mps for lio_overspeed_s.
lio_lost_exit_s: 3.0
lio_max_speed_mps: 30.0
lio_overspeed_s: 0.5
lio_publish_scans: true                    # /cloud_registered (world frame): feeds the voxel map
# Full undistorted scans on /cloud_registered (~24k points x 48 B per frame,
# ~11 MB/s on the local DDS) rather than the 0.5 m feature cloud; the voxel map
# needs them, and the flight recorder excludes the derived clouds.
lio_dense_scans: true

# Voxel map of the registered scans. Fine: new voxels only, every
# update period, on /lio/map/updates (viewers accumulate them), and what
# /lio/map/save writes (binary PCD into lio_map_dir). Overview: the whole
# map, latched on /lio/map, for viewers that connect late.
lio_map_voxel_m: 0.05
lio_map_max_points: 4000000                # 64 MB of points; stops growing (WARN) beyond
lio_map_update_period_s: 1.0
lio_map_overview_voxel_m: 0.2
lio_map_overview_max_points: 2000000
lio_map_publish_period_s: 10.0             # overview
# A point joins the map only once its cell (0.5 m across, 0.25 m tall) holds
# this many distinct fine voxels: surfaces fill cells within a scan or two, the
# Avia's stray far returns (untagged, random range along real beams) never do.
# 1 maps every point.
lio_map_promote_voxels: 3
lio_map_dir: /data/maps

# Bridge: FAST-LIO's IMU pose -> base_link odometry on lio_odometry_topic,
# through base_link -> lio_imu_frame from /tf_static.
lio_odometry_topic: /lio/odometry
lio_twist_stddev_mps: 0.05

# The E1R in the same map: lio_register.py places every E1R point in
# FAST-LIO's frame with the Avia IMU's pose at that point's firing time
# (interpolated between FAST-LIO's 10 Hz poses) and the E1R's mount from TF
# (base_link -> e1r_nominal_lidar_frame: the URDF's nominal extrinsic until
# calibrated), then the voxel map adds it like FAST-LIO's own scans.
lio_e1r_enabled: true
lio_e1r_topic: /e1r/points
lio_e1r_time_field: timestamp              # per-point UTC seconds (float64), PTP-locked like the Avia
lio_e1r_registered_topic: /lio/registered/e1r
# Range gate. No returns are NaN since the e1r role's 2026-10-02 fix (they
# were (0, 0, 0) before); 0.1 m also drops the near field. No upper limit.
lio_e1r_min_range_m: 0.1
lio_e1r_max_range_m: 0.0
lio_e1r_max_pose_gap_s: 0.25               # bracketing poses further apart: FAST-LIO stalled or restarted
lio_e1r_max_wait_s: 0.5                    # for the first pose after a frame's last point

# Divergence (README): the watchdog reads FAST-LIO's log ("No Effective Points!",
# "No point, skip this scan!", "FAST-LIO lost") and odometry (impossible speeds,
# leaps), publishes /lio/health, and the E1R registration and the map stop on
# DIVERGED (the map taking back what arrived since the onset). A run of evidence
# this long is a divergence; shorter ones (a featureless moment) are only
# 'degraded'. It restarts nothing: FAST-LIO exits when lost (lio_lost_exit_s,
# longer than this) and systemd restarts it, every time.
lio_watchdog_enabled: true
lio_watchdog_sustain_s: 2.0
