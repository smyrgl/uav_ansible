---
# FAST-LIO from the pinned source into the shared workspace: the aircraft (main.yml)
# and the replay host (roles/replay) run exactly this.
- name: Install FAST-LIO build dependencies
  ansible.builtin.apt:
    name:
      - git
      - libeigen3-dev
      - libpcl-dev
      - python3-dev                 # FAST-LIO includes Python.h (matplotlibcpp)
      - python3-numpy
      - "ros-{{ ros_distro }}-pcl-ros"
      - "ros-{{ ros_distro }}-pcl-conversions"
      - "ros-{{ ros_distro }}-rclcpp-components"
      - "ros-{{ ros_distro }}-std-srvs"
      - "ros-{{ ros_distro }}-visualization-msgs"
      - "ros-{{ ros_distro }}-nav-msgs"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check that the Livox messages are built (avia role)
  ansible.builtin.stat:
    path: "{{ lio_workspace }}/install/share/livox_ros_driver2/package.xml"
  register: lio_livox_messages

- name: Refuse to build FAST-LIO without the Livox messages
  ansible.builtin.assert:
    that: lio_livox_messages.stat.exists
    fail_msg: Run the avia role first (it builds livox_ros_driver2 and publishes /avia/custom).
    quiet: true

- name: Fetch the pinned FAST-LIO source
  ansible.builtin.git:
    repo: "{{ lio_repository }}"
    dest: "{{ lio_checkout_dir }}"
    version: "{{ lio_revision }}"
    recursive: true
  register: lio_checkout

- name: Check for the prepared FAST-LIO build tree
  ansible.builtin.stat:
    path: "{{ lio_source_dir }}/CMakeLists.txt"
  register: lio_tree

# The pinned checkout stays pristine; the copy colcon builds gets uav_ansible's
# edits (files/patch_fast_lio.py: C++17, a gravity-aligned world frame, exit when
# lost). The copy records the patch script's fingerprint, so a changed script
# re-prepares and rebuilds it.
- name: Create the uav script directory
  ansible.builtin.file:
    path: /usr/local/lib/uav
    state: directory
    mode: "0755"

- name: Install FAST-LIO's patch script
  ansible.builtin.copy:
    src: patch_fast_lio.py
    dest: /usr/local/lib/uav/patch_fast_lio.py
    mode: "0755"

- name: Fingerprint the patch script
  ansible.builtin.command: /usr/bin/python3 /usr/local/lib/uav/patch_fast_lio.py --fingerprint
  register: lio_patch_fingerprint
  changed_when: false

- name: Read the build tree's patch marker
  ansible.builtin.slurp:
    src: "{{ lio_source_dir }}/.uav_patches"
  register: lio_patch_marker
  failed_when: false

- name: Prepare the FAST-LIO build tree (uav_ansible's patches)
  ansible.builtin.shell: |
    set -e
    rm -rf {{ lio_source_dir }}
    cp -a {{ lio_checkout_dir }} {{ lio_source_dir }}
    rm -rf {{ lio_source_dir }}/.git
    /usr/bin/python3 /usr/local/lib/uav/patch_fast_lio.py {{ lio_source_dir }}
  args:
    executable: /bin/bash
  when: >-
    lio_checkout is changed or not lio_tree.stat.exists or
    ((lio_patch_marker.content | default('') | b64decode | trim) != lio_patch_fingerprint.stdout)
  register: lio_source

- name: Check for the FAST-LIO executable
  ansible.builtin.stat:
    path: "{{ lio_workspace }}/install/lib/fast_lio/fastlio_mapping"
  register: lio_executable

- name: Build FAST-LIO
  ansible.builtin.shell: |
    set -e
    source /opt/ros/{{ ros_distro }}/setup.bash
    source {{ lio_workspace }}/install/local_setup.bash
    MAKEFLAGS=-j{{ lio_build_jobs }} colcon build --merge-install --packages-select fast_lio --cmake-args -DCMAKE_BUILD_TYPE=Release
  args:
    executable: /bin/bash
    chdir: "{{ lio_workspace }}"
  when: lio_source is changed or not lio_executable.stat.exists
  notify: Restart lio

