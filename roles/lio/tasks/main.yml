---
# FAST-LIO2 on the Avia (see defaults). The livox_ros_driver2 messages and the
# /avia/custom + /avia/imu topics come from the avia role.
- name: Install and run FAST-LIO
  when: lio_state == 'present'
  block:
    - name: Build FAST-LIO (shared with the replay host)
      ansible.builtin.include_tasks: build.yml

    - name: Let the service write FAST-LIO's log and map directories
      ansible.builtin.file:
        path: "{{ lio_source_dir }}/{{ item }}"
        state: directory
        owner: "{{ lio_service_user }}"
        group: "{{ lio_service_user }}"
        mode: "0755"
      loop:
        - Log
        - PCD

    - name: Install the lio nodes (shared with the replay host)
      ansible.builtin.include_tasks: scripts.yml

    - name: Install the lio bridge unit
      ansible.builtin.template:
        src: uav-lio-bridge.service.j2
        dest: /etc/systemd/system/uav-lio-bridge.service
        mode: "0644"
      notify: Restart lio bridge

    - name: Enable the lio bridge at boot
      ansible.builtin.systemd_service:
        name: uav-lio-bridge.service
        enabled: true
        state: started
        daemon_reload: true

    # Owned by the service user; the operator's group can read and prune.
    - name: Create the map directory
      ansible.builtin.file:
        path: "{{ lio_map_dir }}"
        state: directory
        owner: "{{ lio_service_user }}"
        group: "{{ target_user }}"
        mode: "2775"

    - name: Install the lio map unit
      ansible.builtin.template:
        src: uav-lio-map.service.j2
        dest: /etc/systemd/system/uav-lio-map.service
        mode: "0644"
      notify: Restart lio map

    - name: Enable the lio map at boot
      ansible.builtin.systemd_service:
        name: uav-lio-map.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Install the E1R registration unit
      ansible.builtin.template:
        src: uav-lio-e1r.service.j2
        dest: /etc/systemd/system/uav-lio-e1r.service
        mode: "0644"
      notify: Restart lio e1r

    - name: Run the E1R registration at boot (or stop it when disabled)
      ansible.builtin.systemd_service:
        name: uav-lio-e1r.service
        enabled: "{{ lio_e1r_enabled | bool }}"
        state: "{{ 'started' if lio_e1r_enabled | bool else 'stopped' }}"
        daemon_reload: true

    # The watchdog runs as the service user; this rule lets that user restart
    # FAST-LIO's unit and nothing else (polkit, so NoNewPrivileges services can).
    - name: Allow the LIO watchdog to restart FAST-LIO
      ansible.builtin.template:
        src: 60-uav-lio-watchdog.rules.j2
        dest: /etc/polkit-1/rules.d/60-uav-lio-watchdog.rules
        owner: root
        group: root
        mode: "0644"
      when: lio_watchdog_enabled | bool and lio_watchdog_restart | bool

    - name: Remove the restart permission when the watchdog may not restart
      ansible.builtin.file:
        path: /etc/polkit-1/rules.d/60-uav-lio-watchdog.rules
        state: absent
      when: not (lio_watchdog_enabled | bool and lio_watchdog_restart | bool)

    - name: Install the LIO watchdog unit
      ansible.builtin.template:
        src: uav-lio-watchdog.service.j2
        dest: /etc/systemd/system/uav-lio-watchdog.service
        mode: "0644"
      notify: Restart lio watchdog

    - name: Run the LIO watchdog at boot (or stop it when disabled)
      ansible.builtin.systemd_service:
        name: uav-lio-watchdog.service
        enabled: "{{ lio_watchdog_enabled | bool }}"
        state: "{{ 'started' if lio_watchdog_enabled | bool else 'stopped' }}"
        daemon_reload: true

    - name: Configure FAST-LIO
      ansible.builtin.template:
        src: fast_lio.yaml.j2
        dest: "{{ lio_config_path }}"
        mode: "0644"
      notify: Restart lio

    - name: Install the FAST-LIO unit
      ansible.builtin.template:
        src: uav-lio.service.j2
        dest: /etc/systemd/system/uav-lio.service
        mode: "0644"
      notify: Restart lio

    - name: Enable FAST-LIO at boot
      ansible.builtin.systemd_service:
        name: uav-lio.service
        enabled: true
        state: started
        daemon_reload: true

- name: Stop and remove FAST-LIO's unit
  when: lio_state == 'absent'
  block:
    - name: Stop and disable FAST-LIO and its bridge
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - uav-lio.service
        - uav-lio-bridge.service
        - uav-lio-map.service
        - uav-lio-e1r.service
        - uav-lio-watchdog.service
      failed_when: false

    - name: Remove the FAST-LIO units, configuration and bridge
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/uav-lio.service
        - /etc/systemd/system/uav-lio-bridge.service
        - /etc/systemd/system/uav-lio-map.service
        - /etc/systemd/system/uav-lio-e1r.service
        - /etc/systemd/system/uav-lio-watchdog.service
        - /etc/polkit-1/rules.d/60-uav-lio-watchdog.rules
        - "{{ lio_config_path }}"
        - /usr/local/lib/uav/lio_bridge.py
        - /usr/local/lib/uav/test_lio_bridge.py
        - /usr/local/lib/uav/lio_map.py
        - /usr/local/lib/uav/test_lio_map.py
        - /usr/local/lib/uav/lio_register.py
        - /usr/local/lib/uav/test_lio_register.py
        - /usr/local/lib/uav/lio_health.py
        - /usr/local/lib/uav/test_lio_health.py
        - /usr/local/lib/uav/lio_watchdog.py
