---
- name: Install developer tooling
  ansible.builtin.apt:
    name: "{{ dev_tools_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Initialise git-lfs for the target user
  ansible.builtin.command:
    cmd: git lfs install
  become: true
  become_user: "{{ target_user }}"
  register: git_lfs_init
  changed_when: "'already initialized' not in (git_lfs_init.stdout | default(''))"
