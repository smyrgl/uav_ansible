---
# AUDIT FIRST. On a 7.x/Noble kernel, igc (i226) and ch341 (CH34x) are very
# likely already in-tree modules — verify before building anything. Only the
# 802.11ax USB Wi-Fi dongle is expected to genuinely need an out-of-tree DKMS
# driver. This role builds *only* what kernel_dkms_drivers lists.

- name: Audit — check whether expected modules already ship in this kernel
  ansible.builtin.command:
    cmd: "modinfo {{ item }}"
  loop: "{{ kernel_modules_verify }}"
  register: modinfo_audit
  changed_when: false
  failed_when: false

- name: Report audit result (build only what is genuinely missing)
  ansible.builtin.debug:
    msg: >-
      {{ item.item }}:
      {{ 'present in kernel' if item.rc == 0 else 'MISSING — add to kernel_dkms_drivers if needed' }}
  loop: "{{ modinfo_audit.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure present modules load at boot
  ansible.builtin.copy:
    dest: "/etc/modules-load.d/uav.conf"
    mode: "0644"
    content: |
      # Managed by uav_ansible
      {% for m in kernel_modules_verify %}
      {{ m }}
      {% endfor %}
  notify: Schedule reboot

# --- Out-of-tree DKMS drivers (Wi-Fi dongle, etc.) --------------------------
# DKMS rebuilds these automatically on kernel updates — essential on Jetson,
# where `nvidia-l4t-kernel` bumps would otherwise drop hand-built modules.
- name: Install DKMS toolchain + matching L4T kernel headers
  ansible.builtin.apt:
    name:
      - dkms
      - bc
      - libssl-dev
      - "{{ kernel_headers_package }}"
    state: present
  when: kernel_dkms_drivers | length > 0
  # kernel_headers_package ({{ kernel_headers_package }}) provides headers matching
  # the running L4T kernel — verify the name on 7.2 (see group_vars).

# Source is VENDORED (pinned) as a tarball under files/ and committed via
# git-lfs — deterministic, offline, no remote scripts. Each tarball contains a
# top-level <name>-<version>/ dir with the driver's own dkms.conf.
- name: Extract vendored driver source into /usr/src
  ansible.builtin.unarchive:
    src: "{{ item.tarball }}"
    dest: /usr/src
    creates: "/usr/src/{{ item.name }}-{{ item.version }}"
  loop: "{{ kernel_dkms_drivers }}"
  loop_control:
    label: "{{ item.name }}-{{ item.version }}"

- name: Build + install each driver via DKMS (its own dkms.conf name/version)
  ansible.builtin.shell:
    cmd: |
      set -e
      name="{{ item.name }}"; ver="{{ item.version }}"
      if dkms status -m "$name" -v "$ver" 2>/dev/null | grep -q installed; then
        echo "already installed"; exit 0
      fi
      dkms add -m "$name" -v "$ver" 2>/dev/null || true
      dkms build -m "$name" -v "$ver"
      dkms install -m "$name" -v "$ver" --force
      echo "installed now"
    executable: /bin/bash
  register: dkms_build
  changed_when: "'already installed' not in dkms_build.stdout"
  loop: "{{ kernel_dkms_drivers }}"
  loop_control:
    label: "{{ item.name }}/{{ item.version }}"
  notify: Schedule reboot

- name: Verify the built module is now visible to the kernel
  ansible.builtin.command: "modinfo {{ item.module }}"
  loop: "{{ kernel_dkms_drivers }}"
  loop_control:
    label: "{{ item.module }}"
  register: dkms_modinfo
  changed_when: false
  failed_when: false
