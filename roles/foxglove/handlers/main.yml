---
- name: Restart uav-foxglove
  ansible.builtin.systemd:
    name: uav-foxglove.service
    state: restarted
    daemon_reload: true


- name: Restart D555 frame adapter
  ansible.builtin.systemd_service:
    name: uav-d555-frames.service
    state: restarted
    daemon_reload: true

- name: Restart depth relay
  ansible.builtin.systemd_service:
    name: uav-d555-depth-throttle.service
    state: restarted
    daemon_reload: true
