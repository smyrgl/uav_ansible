---
# Septentrio's official ROS 2 driver, pointed at the read-only SBF fan-out.
- name: Install the Septentrio ROS 2 driver and GPS message packages
  ansible.builtin.apt:
    name:
      - "ros-{{ ros_distro }}-septentrio-gnss-driver"
      - "ros-{{ ros_distro }}-gps-msgs"
    state: present
    update_cache: true
    cache_valid_time: 3600
  notify: Restart GNSS ROS driver

- name: Configure the GNSS ROS driver
  ansible.builtin.template:
    src: gnss.yaml.j2
    dest: "{{ gnss_ros_config }}"
    mode: "0644"
  notify: Restart GNSS ROS driver

- name: Install the GNSS ROS driver service
  ansible.builtin.template:
    src: uav-gnss-ros.service.j2
    dest: /etc/systemd/system/uav-gnss-ros.service
    mode: "0644"
  notify: Restart GNSS ROS driver

- name: Enable the GNSS ROS driver at boot
  ansible.builtin.systemd_service:
    name: uav-gnss-ros.service
    enabled: true
    state: started
    daemon_reload: true
