---
# Variables of the roles whose build steps run here (their defaults are not in
# scope otherwise); overrides come after as facts, which outrank include_vars.
- name: Load the aircraft roles' defaults
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../{{ item }}/defaults/main.yml"
  loop: [ros_health, avia, lio, px4_bridge]

- name: Size the FAST-LIO build for this host
  ansible.builtin.set_fact:
    lio_build_jobs: "{{ replay_lio_build_jobs }}"

- name: Install the replay host's packages
  ansible.builtin.apt:
    name:
      - "ros-{{ ros_distro }}-rmw-cyclonedds-cpp"
      - "ros-{{ ros_distro }}-pcl-ros"
      - "ros-{{ ros_distro }}-foxglove-bridge"
      - "ros-{{ ros_distro }}-rosbag2-storage-mcap"
      - "ros-{{ ros_distro }}-nav-msgs"
      - "ros-{{ ros_distro }}-std-srvs"
      - python3-venv
      - python3-numpy
      - python3-yaml
      - python3-colcon-common-extensions
      - rsync
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check for the flights dataset
  ansible.builtin.command: zfs list -H -o name {{ replay_zfs_dataset }}
  register: replay_dataset
  changed_when: false
  failed_when: false
  when: replay_zfs_dataset | length > 0

- name: Create the flights dataset
  ansible.builtin.command: zfs create -o mountpoint={{ replay_flights_dir }} {{ replay_zfs_dataset }}
  when: replay_zfs_dataset | length > 0 and replay_dataset.rc != 0

- name: Own the flights directory
  ansible.builtin.file:
    path: "{{ replay_flights_dir }}"
    state: directory
    owner: "{{ replay_user }}"
    group: "{{ replay_group }}"
    mode: "0755"

- name: Create the shared directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/uav
    - /opt/uav/vendor
    - /etc/uav/ros
    - /usr/local/lib/uav

- name: Install the replay ROS environment (own domain, loopback only)
  ansible.builtin.template:
    src: environment.j2
    dest: "{{ replay_environment_file }}"
    mode: "0644"

- name: Bind Cyclone DDS to loopback
  ansible.builtin.template:
    src: cyclonedds.xml.j2
    dest: "{{ replay_cyclone_config }}"
    mode: "0644"

- name: Build the firmware-matched PX4 messages
  ansible.builtin.include_role:
    name: ros_health
    tasks_from: px4_messages.yml

- name: Build the Livox messages
  ansible.builtin.include_role:
    name: avia
    tasks_from: messages.yml

- name: Build FAST-LIO
  ansible.builtin.include_role:
    name: lio
    tasks_from: build.yml

- name: Install the lio nodes
  ansible.builtin.include_role:
    name: lio
    tasks_from: scripts.yml

- name: Build the PX4 bridge
  ansible.builtin.include_role:
    name: px4_bridge
    tasks_from: build.yml

- name: Give FAST-LIO its log and PCD directories (it opens a position log there at start)
  ansible.builtin.file:
    path: "{{ lio_source_dir }}/{{ item }}"
    state: directory
    owner: "{{ replay_user }}"
    group: "{{ replay_group }}"
    mode: "0755"
  loop: [Log, PCD]

- name: Configure FAST-LIO as on the aircraft
  ansible.builtin.template:
    src: "{{ role_path }}/../lio/templates/fast_lio.yaml.j2"
    dest: "{{ lio_config_path }}"
    mode: "0644"

- name: Configure the PX4 bridge as on the aircraft
  ansible.builtin.template:
    src: "{{ role_path }}/../px4_bridge/templates/px4_bridge.yaml.j2"
    dest: "{{ px4_bridge_config }}"
    mode: "0644"

- name: Install the scoring environment
  ansible.builtin.pip:
    name:
      - "evo=={{ replay_evo_version }}"
      - "mcap=={{ replay_mcap_version }}"
      - "pyulog=={{ replay_pyulog_version }}"
      - "mcap-ros2-support=={{ replay_mcap_ros2_version }}"
      - zstandard
    virtualenv: "{{ replay_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv
    virtualenv_site_packages: true

- name: Install the ulog converter (tools/ulog2mcap.py)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/tools/ulog2mcap.py"
    dest: /usr/local/lib/uav/ulog2mcap.py
    mode: "0755"

- name: Install the replay scorer
  ansible.builtin.copy:
    src: replay_score.py
    dest: /usr/local/lib/uav/replay_score.py
    mode: "0755"

# Stage 1 estimator truth (tools/estimator_truth.py): every odometry in a bag
# against the RTK + heading reference recorded in the same bag.
- name: Install the estimator-truth scorer and its tests
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/tools/{{ item }}"
    dest: "/usr/local/lib/uav/{{ item }}"
    mode: "0755"
  loop:
    - estimator_truth.py
    - test_estimator_truth.py

- name: Run the estimator-truth tests in the scoring environment
  ansible.builtin.command:
    argv: ["{{ replay_venv }}/bin/python", -m, unittest, -q, test_estimator_truth]
    chdir: /usr/local/lib/uav
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  changed_when: false

- name: Install the replay launcher
  ansible.builtin.template:
    src: uav-replay.j2
    dest: /usr/local/bin/uav-replay
    mode: "0755"

- name: Install the automatic replay of new bags
  ansible.builtin.template:
    src: uav-replay-new.j2
    dest: /usr/local/bin/uav-replay-new
    mode: "0755"

- name: Install the automatic replay service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - uav-replay-new.service
    - uav-replay-new.timer

- name: Run the automatic replay timer (or stop it when disabled)
  ansible.builtin.systemd_service:
    name: uav-replay-new.timer
    enabled: "{{ replay_auto_enabled | bool }}"
    state: "{{ 'started' if replay_auto_enabled | bool else 'stopped' }}"
    daemon_reload: true

- name: Offload key and archive tier
  ansible.builtin.include_tasks: offload.yml
