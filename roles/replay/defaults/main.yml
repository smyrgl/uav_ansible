---
# The replay and archive host (autonomy roadmap §7.7, Stage 0b/1): the owner's
# x86 NVIDIA workstation. It runs the aircraft's own source builds (FAST-LIO,
# the Livox messages, px4_msgs, the lio nodes, the PX4 bridge) against recorded
# bags, on its own DDS domain over loopback, and scores the replay against the
# live run recorded in the same bag.
replay_user: john
replay_group: john
replay_domain_id: 42                      # never the aircraft's 0
replay_environment_file: /etc/uav/ros/environment
replay_cyclone_config: /etc/uav/ros/cyclonedds.xml
# Where bags live: a ZFS dataset of its own (snapshots, quota), mounted here.
replay_flights_dir: /srv/flights
replay_zfs_dataset: rpool/flights          # "" to skip dataset management
replay_venv: /opt/uav/replay-venv          # evo + mcap + numpy, system ROS visible
replay_evo_version: "1.31.1"
replay_mcap_version: "1.5.0"
replay_pyulog_version: "1.2.4"
# ulog-to-bag alignment gate (autonomy roadmap Stage 0b): pps_capture residual median
replay_ulog_align_median_ms: 2.0
replay_lio_build_jobs: 12                  # 24 threads, 62 GB: the IKFoM templates fit
# Scoring gates (autonomy roadmap Stage 0b): APE of the replayed /lio/odometry
# against the live one, and the voxel maps' Jaccard at the fine voxel.
replay_ape_median_m: 0.02
replay_map_jaccard_min: 0.98
# Until every bag starts with a live map reset (flight_recorder
# reset_map_on_start), the live map is older and larger than the replayed one:
# gate on recall (replayed voxels the live map also holds) instead of Jaccard.
# Set 0 to gate on Jaccard.
replay_map_recall_min: 0.98
replay_match_window_ms: 20.0
# Offload from the aircraft: its key (fetched by the aircraft play into
# .offload-keys/<host>.pub) is installed restricted to rrsync into the dataset.
replay_offload_source_host: jethawk
# Archive tier: the TrueNAS SMB share, user "uav" (password in the vault as
# truenas_uav_password), mounted on demand and mirrored one way by a timer.
replay_archive_share: //10.0.0.15/flight      # truenas.local, /mnt/main/flight
replay_archive_user: uav
replay_archive_dir: /srv/archive
replay_archive_unit: srv-archive              # systemd needs the unit named after the path
replay_archive_credentials: /etc/uav/truenas.cred
replay_archive_interval: 1h
