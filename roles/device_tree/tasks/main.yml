---
# Device-tree overlays, applied via the extlinux OVERLAYS key (confirmed on the
# target). Two overlays:
#   - pps-gpio  : mosaic 1PPS on GPIO07 (PG.06) -> /dev/gnss-pps  [hand-written]
#   - pwm-hdr40 : PWM out on GPIO12 (pin 15, soc_gpio39_pn1)      [jetson-io-generated]
#
# Remaining on-device TODO: verify the PWM actually drives (see the note at the
# end) — jetson-io emitted nvidia,function="gp" + gpio-mode=1, which we trust
# but should confirm.

# Overlays name the board they apply to; read it from the running tree so the
# same role works on any p3767 SKU/carrier the UEFI would match.
- name: Read the board compatible
  ansible.builtin.shell:
    cmd: "tr '\\0' '\\n' < /proc/device-tree/compatible | head -n1"
  register: dt_board_compatible_raw
  changed_when: false

- name: Use it for the overlays
  ansible.builtin.set_fact:
    dt_board_compatible: "{{ dt_board_compatible_raw.stdout | trim }}"

- name: Install device-tree compiler
  ansible.builtin.apt:
    name: device-tree-compiler
    state: present

- name: Create overlay source dir
  ansible.builtin.file:
    path: "{{ dt_overlay_src_dir }}"
    state: directory
    mode: "0755"

# --- PWM overlay: jetson-io output, committed verbatim, board-matched ---------
- name: Stage PWM overlay source (jetson-io-generated)
  ansible.builtin.copy:
    src: pwm-hdr40.dts
    dest: "{{ dt_overlay_src_dir }}/pwm-hdr40.dts"
    mode: "0644"
  register: pwm_src

- name: Check for the compiled PWM overlay
  ansible.builtin.stat:
    path: "{{ dt_pwm_dtbo }}"
  register: pwm_dtbo

# Recompile when the source changes, not only when the dtbo is missing.
- name: Compile PWM overlay
  ansible.builtin.command:
    cmd: "dtc -I dts -O dtb -o {{ dt_pwm_dtbo }} {{ dt_overlay_src_dir }}/pwm-hdr40.dts"
  when: pwm_src is changed or not pwm_dtbo.stat.exists
  notify: Reboot required (device_tree)

# --- PPS overlay: hand-written; cpp-preprocessed for the tegra234 gpio macro ---
# The dt-bindings header (tegra234-gpio.h) ships with the kernel headers, so we
# install them (same package DKMS needs) and auto-discover the include dir.
- name: Install kernel headers (dt-bindings for overlays; also required by DKMS)
  ansible.builtin.apt:
    name: "{{ kernel_headers_package }}"
    state: present

- name: Locate the tegra234 dt-bindings header
  ansible.builtin.find:
    paths: /usr/src
    patterns: "tegra234-gpio.h"
    recurse: true
  register: dt_bindings_hdr
  when: not kernel_dt_include_dir

- name: Derive kernel_dt_include_dir (the include/ dir that holds dt-bindings/)
  ansible.builtin.set_fact:
    kernel_dt_include_dir: "{{ dt_bindings_hdr.files[0].path | regex_replace('/dt-bindings/gpio/tegra234-gpio.h$', '') }}"
  when:
    - not kernel_dt_include_dir
    - dt_bindings_hdr.files | default([]) | length > 0

- name: Stage PPS overlay source
  ansible.builtin.template:
    src: pps-gpio.dts.j2
    dest: "{{ dt_overlay_src_dir }}/pps-gpio.dts"
    mode: "0644"
  register: pps_src

- name: Check for the compiled PPS overlay
  ansible.builtin.stat:
    path: "{{ dt_pps_dtbo }}"
  register: pps_dtbo

- name: Warn if the dt-bindings header was not found
  ansible.builtin.debug:
    msg: >-
      tegra234-gpio.h not found under /usr/src after installing
      {{ kernel_headers_package }}. The PPS overlay can't preprocess until
      kernel_dt_include_dir points at an include/ dir containing dt-bindings/
      (fall back to the L4T public_sources kernel tree). Skipping PPS compile.
  when: not kernel_dt_include_dir

- name: Compile PPS overlay (preprocess for dt-binding macros)
  ansible.builtin.shell:
    cmd: >
      cpp -nostdinc -undef -x assembler-with-cpp
      -I {{ kernel_dt_include_dir }}
      {{ dt_overlay_src_dir }}/pps-gpio.dts |
      dtc -@ -I dts -O dtb -o {{ dt_pps_dtbo }} -
  when:
    - kernel_dt_include_dir | length > 0
    - pps_src is changed or not pps_dtbo.stat.exists
  notify: Reboot required (device_tree)

# /dev/ppsN numbering isn't stable (see the rule), so chrony uses this name.
- name: Install udev rule for a stable PPS device name
  ansible.builtin.template:
    src: 99-gnss-pps.rules.j2
    dest: /etc/udev/rules.d/99-gnss-pps.rules
    mode: "0644"
  notify: Reload udev (pps)

# --- Apply: FDT + OVERLAYS in the DEFAULT entry (BOOT-CRITICAL) ----------------
# A backup is taken once; the script also keeps the previous file as
# .uav-prev and replaces the config atomically. It edits dt_extlinux_label and
# makes it the DEFAULT — see group_vars for why that is L4T's "primary".
# NOTE: if you enabled PWM manually via jetson-io, its entry references
# /boot/jetson-io-hdr40-user-custom.dtbo — this role manages the equivalent.
- name: Back up extlinux.conf (once)
  ansible.builtin.copy:
    src: "{{ extlinux_conf }}"
    dest: "{{ extlinux_conf }}.uav.bak"
    remote_src: true
    force: false

- name: Put FDT + OVERLAYS in the DEFAULT boot entry
  ansible.builtin.script:
    cmd: >-
      uav-extlinux-overlays.py {{ extlinux_conf }} {{ dt_extlinux_label }}
      {{ dt_base_dtb }} {{ dt_overlay_dtbos | join(',') }}
    executable: /usr/bin/python3
  register: extlinux_edit
  changed_when: "'changed=1' in extlinux_edit.stdout"
  notify: Reboot required (device_tree)

- name: Verify note
  ansible.builtin.debug:
    msg: >-
      After reboot, confirm PWM works: `ls /sys/class/pwm/` should show a chip and
      `cat /sys/kernel/debug/pinctrl/*pinmux*/pinmux-pins | grep pn1` should show
      soc_gpio39_pn1 muxed to its PWM function. Confirm PPS with
      `sudo ppstest {{ pps_device }}` (one assert a second, sequence counting up;
      the receiver drives it only while it has a PVT).
