---
# Device-tree overlays for:
#   - pps-gpio on header pin {{ dt_pps_gpio_header_pin }}  (Mosaic 1PPS -> /dev/pps0)
#   - PWM out on header pin {{ dt_pwm_gpio_header_pin }}   (-> RP2040 neopixels)
# Overlays require a reboot to apply.
#
# Pins are RESOLVED from the NVIDIA Pinmux Template v1.2 (see group_vars):
#   pps-gpio: GPIO11 -> GPIO3_PQ.06 (soc_gpio33_pq6)  [overlay complete]
#   pwm:      GPIO12 -> GPIO3_PN.01 (soc_gpio39_pn1, GP_PWM1)  [2 labels to confirm]
# Remaining on-device TODOs:
#   1. Set kernel_dt_include_dir (L4T kernel source include/ with tegra234-gpio.h)
#      so the pps overlay's macros preprocess.
#   2. PWM pinmux: &pwm1 (pwm@3280000) + &pinmux (pinmux@2430000) CONFIRMED. Use
#      jetson-io to generate/verify the pinmux function + state wiring for the PWM
#      pin (the Tegra-supported path), then reconcile with pwm-out.dts.j2. The
#      function name is listed under /sys/kernel/debug/pinctrl/*pinmux*/pinmux-functions.
#   3. Wire the overlay-apply step (extlinux FDTOVERLAYS; jetson-io manages this
#      too) — the pps-gpio overlay in particular must be added to FDTOVERLAYS.

- name: Install device-tree compiler
  ansible.builtin.apt:
    name: device-tree-compiler
    state: present

- name: Stage overlay sources
  ansible.builtin.template:
    src: "{{ item }}.dts.j2"
    dest: "/boot/uav-overlays/{{ item }}.dts"
    mode: "0644"
  loop:
    - pps-gpio
    - pwm-out
  register: dts_staged

# Preprocess with cpp (the pps overlay #includes tegra234-gpio.h and uses macros),
# then compile. kernel_dt_include_dir must point at the L4T kernel source include/.
- name: Compile overlays to .dtbo
  ansible.builtin.shell:
    cmd: >
      cpp -nostdinc -undef -x assembler-with-cpp
      {{ ('-I ' + kernel_dt_include_dir) if kernel_dt_include_dir else '' }}
      /boot/uav-overlays/{{ item }}.dts |
      dtc -@ -I dts -O dtb -o /boot/uav-overlays/{{ item }}.dtbo -
    creates: "/boot/uav-overlays/{{ item }}.dtbo"
  loop:
    - pps-gpio
    - pwm-out
  notify: Schedule reboot

- name: Apply overlays (PLACEHOLDER)
  ansible.builtin.debug:
    msg: >-
      TODO: wire .dtbo application for JetPack 7.2 (extlinux FDTOVERLAYS /
      jetson-io). Until then, overlays are compiled but not yet applied.
