---
# Two L2 segments, never bridged. gPTP (802.1AS) is link-local and a Linux bridge
# is not a transparent clock — bridging would wreck PTP sync. The Jetson is
# multi-homed; route at L3 if cross-segment IP reachability is needed.
- name: Wifi credentials must come from group_vars/vault.yml
  ansible.builtin.assert:
    that:
      - vault_wifi_ssid is defined
      - vault_wifi_password is defined
    fail_msg: >-
      wifi_enabled is true but vault_wifi_ssid / vault_wifi_password are not
      set. Create group_vars/vault.yml from vault.yml.example (README, Secrets).
    quiet: true
  when: wifi_enabled

- name: Install wpa_supplicant (wifi via netplan/networkd)
  ansible.builtin.apt:
    name: wpasupplicant
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: wifi_enabled | default(false)

# --- Uplink first -------------------------------------------------------------
# The LAN cutover to its static lan_address removes whatever address this box
# is reached on during bench bring-up (the Holybro switch patched into a home
# LAN, on DHCP). So the wifi uplink has its own file, applied on its own, and it
# must hold a default route BEFORE the LAN config is even written: a written but
# unapplied netplan file would cut over at the next reboot instead. If the uplink
# never comes up, the play stops here with the LAN untouched.
# Run a cutover detached (e.g. in tmux): the SSH session it rides on will drop.
- name: Render netplan uplink (wifi)
  ansible.builtin.template:
    src: 61-uav-uplink.yaml.j2
    dest: "{{ netplan_uplink_file }}"
    owner: root
    group: root
    mode: "0600"        # holds the PSK; netplan warns on world-readable files
  register: uplink_netplan
  when: wifi_enabled

- name: Remove the uplink config when wifi is disabled
  ansible.builtin.file:
    path: "{{ netplan_uplink_file }}"
    state: absent
  when: not wifi_enabled
  notify: Apply netplan

- name: Check the uplink's supplicant
  ansible.builtin.command:
    cmd: "systemctl is-active netplan-wpa-{{ wifi_interface }}.service"
  register: uplink_wpa
  changed_when: false
  failed_when: false
  when: wifi_enabled

# Re-applies whenever the supplicant is not running, not only when the file
# changed: a run that failed here would otherwise never retry.
- name: Bring the uplink up now (the LAN is not touched yet)
  when: wifi_enabled and (uplink_netplan is changed or uplink_wpa.stdout != 'active')
  block:
    # NetworkManager reads netplan's udev hint (NM_UNMANAGED=1) only when a
    # device appears, so at runtime it keeps the dongle, and its wpa_supplicant
    # keeps /run/wpa_supplicant/<iface>. netplan's supplicant then dies with
    # "ctrl_iface exists and seems to be in use". Release it first.
    - name: Release the dongle from NetworkManager
      ansible.builtin.shell:
        cmd: |
          systemctl is-active --quiet NetworkManager || exit 0
          nmcli device set {{ wifi_interface }} managed no
      changed_when: true

    - name: Apply netplan (uplink only on a first run)
      ansible.builtin.command:
        cmd: netplan apply
      changed_when: true

- name: Check whether this run cuts the LAN over
  ansible.builtin.template:
    src: 60-uav.yaml.j2
    dest: "{{ netplan_file }}"
    owner: root
    group: root
    mode: "0600"
  check_mode: true
  register: lan_cutover

- name: Gate — the uplink must hold a default route before the LAN cuts over
  ansible.builtin.command:
    cmd: "ip -4 -o route show default dev {{ wifi_interface }}"
  register: uplink_route
  until: uplink_route.stdout | length > 0
  retries: 30
  delay: 2
  changed_when: false
  when: wifi_enabled and lan_cutover is changed

- name: Report the uplink — reach this box there once the LAN cuts over
  ansible.builtin.debug:
    msg: "{{ wifi_interface }}: {{ uplink_route.stdout }}"
  when: uplink_route.stdout is defined

# --- Drone LAN + PTP segment (static) -----------------------------------------
- name: Render netplan configuration
  ansible.builtin.template:
    src: 60-uav.yaml.j2
    dest: "{{ netplan_file }}"
    owner: root
    group: root
    mode: "0600"        # netplan warns on world-readable files
  notify: Apply netplan

- name: Validate netplan generation
  ansible.builtin.command:
    cmd: netplan generate
  changed_when: false

# Cut over here rather than at the end of the play: later roles then run on the
# final network (their apt traffic goes out over the uplink, proving it), and a
# failure further down can't leave a pending cutover for the next reboot.
- name: Apply the cutover now
  ansible.builtin.meta: flush_handlers

- name: Wait for the uplink to return (netplan apply restarts wpa_supplicant)
  ansible.builtin.command:
    cmd: "ip -4 -o route show default dev {{ wifi_interface }}"
  register: uplink_back
  until: uplink_back.stdout | length > 0
  retries: 30
  delay: 2
  changed_when: false
  when: wifi_enabled and lan_cutover is changed

# --- mDNS ---------------------------------------------------------------------
# jethawk.local must resolve to IPv4. With AAAA records published, macOS
# prefers the ULA IPv6 address the router hands out, which defeats host-key
# pinning by address and every IPv4-only tool on the bench.
- name: Publish mDNS over IPv4 only
  ansible.builtin.lineinfile:
    path: /etc/avahi/avahi-daemon.conf
    regexp: '^#?\s*use-ipv6='
    line: use-ipv6=no
    insertafter: '^\[server\]'
  notify: Restart avahi
  tags: [mdns]
